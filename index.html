  // ============ FIX D11: Type-specific Unsplash photo IDs ============
  var TYPE_IMAGES = {
    House:      'photo-1568605114967-8130f3a36994',
    Apartment:  'photo-1522708323590-d24dbb6b0267',
    Condo:      'photo-1545324418-cc1a3fa10c00',
    Townhouse:  'photo-1570129477492-45c003edd2be',
    Studio:     'photo-1505691938895-1758d7feb511'
  };
  function getDefaultImageForType(type) {
    var t = (type || 'House');
    if (TYPE_IMAGES[t]) return 'https://images.unsplash.com/' + TYPE_IMAGES[t] + '?w=600&q=70&auto=format&fit=crop';
    if (TYPE_IMAGES.House) return 'https://images.unsplash.com/' + TYPE_IMAGES.House + '?w=600&q=70&auto=format&fit=crop';
    return 'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=600&q=70&auto=format&fit=crop';
  }
  var DEFAULT_HOUSE_IMG = getDefaultImageForType('House');

  // Helper: build a lazy-loaded <img> with onerror fallback (FIX E15/D11)
  function imgTag(src, alt, styleAttr) {
    return '<img src="' + escapeHtml(src || DEFAULT_HOUSE_IMG) + '" alt="' + escapeHtml(alt || '') + '"' +
           ' loading="lazy" onerror="' + IMG_ONERROR + '"' +
           (styleAttr ? ' style="' + styleAttr + '"' : '') + '>';
  }

  // Helper: pick the best image for a listing (FIX D11: type-specific fallback)
  function listingImage(listing, idx) {
    if (listing && listing.images && listing.images.length) {
      var i = idx || 0;
      return listing.images[Math.min(i, listing.images.length - 1)] || getDefaultImageForType(listing.type);
    }
    return getDefaultImageForType(listing && listing.type);
  }

  function toast(msg) {
    injectBaseStyles();
    var t = document.createElement('div');
    t.className = 'rhc-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() {
      t.style.opacity = '0';
      t.style.transition = 'opacity .3s';
      setTimeout(function() { if (t.parentNode) t.remove(); }, 300);
    }, 3000);
  }
  window.RHC = RHC; window.toast = toast;

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    });
  }

  // ============ Firebase init + Firestore listeners ============
  async function initFirebase() {
    try {
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js');
      RHC.fb = firebase;
      RHC.fb.initializeApp(fbConfig);
      RHC.db = RHC.fb.firestore();
      RHC.auth = RHC.fb.auth();
      try { RHC.storage = RHC.fb.storage(); } catch(e) { RHC.storage = null; console.warn('RHC: storage init failed (uploads will use Cloudinary only)', e); }

      // FIX v9: Set persistence FIRST and await it before any other auth calls.
      try { await RHC.auth.setPersistence(RHC.fb.auth.Auth.Persistence.LOCAL); }
      catch(e) { console.warn('RHC: persistence set failed', e); }

      // Register the onAuthStateChanged listener BEFORE any signInAnonymously call.
      RHC.auth.onAuthStateChanged(async function(user) {
        if (user) {
          if (user.email && !user.isAnonymous) {
            await loadRenterProfile(user);
            // Sync localStorage saved homes -> Firestore on first sign-in
            if (RHC.renter && RHC.savedHomes.length > 0) {
              for (var i = 0; i < RHC.savedHomes.length; i++) {
                try {
                  await RHC.db.collection('renters').doc(user.uid).collection('saved').doc(RHC.savedHomes[i])
                    .set({ savedAt: RHC.fb.firestore.FieldValue.serverTimestamp() }, { merge: true });
                } catch(e) { console.warn('RHC: sync saved home failed', e); }
              }
              await refreshSavedHomesFromFirestore();
            }
          } else {
            RHC.renter = null;
          }
        } else {
          RHC.renter = null;
        }
        updateAccountButton();
        refreshHeartIcons();
      });

      // FIX v9: Only sign in anonymously if there's NO current user at all.
      if (!RHC.auth.currentUser) {
        try { await RHC.auth.signInAnonymously(); }
        catch(e) { console.warn('RHC: anonymous auth failed', e); }
      }

      // Load branding + social settings
      try {
        var brandDoc = await RHC.db.collection('settings').doc('branding').get();
        if (brandDoc.exists) RHC.branding = Object.assign(RHC.branding, brandDoc.data());
      } catch(e) { console.warn('RHC: branding load failed', e); }
      try {
        var socialDoc = await RHC.db.collection('settings').doc('social').get();
        if (socialDoc.exists) RHC.branding = Object.assign(RHC.branding, socialDoc.data());
      } catch(e) { console.warn('RHC: social load failed', e); }
      updateFooterContact();

      // FIX B7: Before subscribing to Firestore, read cached listings and render immediately
      var cacheRendered = false;
      try {
        var cachedListings = localStorage.getItem('rhc_listings_cache');
        if (cachedListings) {
          var parsed = JSON.parse(cachedListings);
          if (Array.isArray(parsed) && parsed.length > 0) {
            rhcListings = parsed;
            RHC.lastListingsJson = JSON.stringify(parsed);
            // Feed React bundle as well so the bundle's grid doesn't flash empty
            if (typeof window.RHC_SET_LISTINGS === 'function') {
              try { window.RHC_SET_LISTINGS(parsed); } catch(e) {}
            }
            renderCarousels();
            renderOtherHouses();
            updateMap();
            cacheRendered = true;
          }
        }
      } catch(e) { console.warn('RHC: cache read failed', e); }

      // Render skeletons ONLY if cache was empty (so user sees activity if no cache)
      if (!cacheRendered) {
        renderCarouselsSkeleton();
        renderOtherHousesSkeleton();
      }

      // Listen to listings collection -> feed React bundle + split into showcase/other
      try {
        RHC.db.collection('listings').onSnapshot(function(snap) {
          var arr = [];
          snap.forEach(function(d) { arr.push(Object.assign({ id: d.id }, d.data())); });
          // FIX C6: change detection — only re-render carousels if listings data actually changed
          var arrJson = JSON.stringify(arr);
          var dataChanged = (arrJson !== RHC.lastListingsJson);
          rhcListings = arr;
          RHC.lastListingsJson = arrJson;
          // FIX B7: dataLoaded = true -> only show empty states after this point
          RHC.dataLoaded = true;
          // FIX B7: persist to localStorage so refresh shows cached instantly
          try { localStorage.setItem('rhc_listings_cache', JSON.stringify(arr)); } catch(e) { console.warn('RHC: cache write failed', e); }

          // FIX C6: if data didn't change (e.g. Firestore fired a re-snapshot with
          // identical data), SKIP re-rendering entirely. This preserves horizontal
          // scroll positions in the carousels and avoids flicker.
          if (!dataChanged) {
            // Still re-apply heart icons (in case auth state changed)
            refreshHeartIcons();
            return;
          }

          // Feed the React bundle so its uf array re-renders
          if (typeof window.RHC_SET_LISTINGS === 'function') {
            try { window.RHC_SET_LISTINGS(arr); } catch(e) { console.warn('RHC_SET_LISTINGS call failed', e); }
          }
          // Re-render overlay sections (filters applied)
          renderCarousels();
          renderOtherHouses();
          updateMap();
          // FIX D11/E14: re-apply heart state after each render
          refreshHeartIcons();
        }, function(err) {
          console.warn('RHC: listings snapshot failed', err);
          // Even on error, mark dataLoaded so we can show empty states cleanly
          RHC.dataLoaded = true;
          renderCarousels();
          renderOtherHouses();
        });
      } catch(e) { console.warn('RHC: listings listener setup failed', e); }

      // Resume chat if visitor already has one
      if (RHC.currentChatId) listenToChat(RHC.currentChatId);
    } catch (e) {
      console.error('RHC: Firebase init failed', e);
      // Show friendly error in the chat panel if available
      RHC.dataLoaded = true;
      renderCarousels();
      renderOtherHouses();
    }
  }

  async function loadRenterProfile(user) {
    if (!user) { RHC.renter = null; localStorage.removeItem('rhc_renter_cache'); updateAccountButton(); return; }
    if (user.isAnonymous || !user.email) {
      RHC.renter = null;
      localStorage.removeItem('rhc_renter_cache');
      updateAccountButton();
      return;
    }
    try {
      var doc = await RHC.db.collection('renters').doc(user.uid).get();
      if (doc.exists) {
        RHC.renter = { uid: user.uid, email: user.email || '', name: doc.data().name || (user.email || '').split('@')[0] };
      } else {
        RHC.renter = { uid: user.uid, email: user.email || '', name: (user.email || '').split('@')[0] };
      }
      localStorage.setItem('rhc_renter_cache', JSON.stringify(RHC.renter));
      updateAccountButton();
    } catch(e) {
      console.warn('RHC: loadRenterProfile failed', e);
      if (user.email) {
        RHC.renter = { uid: user.uid, email: user.email, name: (user.email || '').split('@')[0] };
        localStorage.setItem('rhc_renter_cache', JSON.stringify(RHC.renter));
        updateAccountButton();
      }
    }
  }

  async function refreshSavedHomesFromFirestore() {
    if (!RHC.renter || !RHC.db) return;
    try {
      var snap = await RHC.db.collection('renters').doc(RHC.renter.uid).collection('saved').get();
      var ids = [];
      snap.forEach(function(d) { ids.push(d.id); });
      RHC.savedHomes = Array.from(new Set(RHC.savedHomes.concat(ids)));
      localStorage.setItem('rhc_saved_homes', JSON.stringify(RHC.savedHomes));
    } catch(e) { console.warn('RHC: refreshSavedHomes failed', e); }
  }

  function injectContentHosts() {
    var listingsEl = document.getElementById('listings');
    if (!listingsEl) return false;

    // Hide the React bundle's listing grid — overlay replaces it
    listingsEl.style.display = 'none';

    // FIX C8: insert in correct order — carousels -> other houses -> map -> (listings hidden)
    // Each insertBefore places the new element before listings.
    // Order of insertion matters: first carouselHost, then otherHousesHost, then mapHost.

    // 1. Featured carousels (NYC + LA rows) — section #2
    if (!carouselHost || !document.body.contains(carouselHost)) {
      carouselHost = document.createElement('div');
      carouselHost.id = 'rhc-city-carousels';
      carouselHost.className = 'rhc-carousels-host';
      listingsEl.parentElement.insertBefore(carouselHost, listingsEl);
    }

    // 2. Rentals Across USA — section #3
    if (!otherHousesHost || !document.body.contains(otherHousesHost)) {
      otherHousesHost = document.createElement('div');
      otherHousesHost.id = 'rhc-other-houses';
      otherHousesHost.className = 'rhc-other-host';
      listingsEl.parentElement.insertBefore(otherHousesHost, listingsEl);
    }

    // 3. The Map — section #4
    if (!mapHost || !document.body.contains(mapHost)) {
      mapHost = document.createElement('div');
      mapHost.id = 'rhc-map-section';
      mapHost.className = 'rhc-map-section';
      mapHost.innerHTML = '<h2>Explore on the map</h2>' +
        '<p>Tap a marker to see available rentals in that area.</p>' +
        '<div id="rhc-leaflet-map"></div>';
      listingsEl.parentElement.insertBefore(mapHost, listingsEl);
    }

    return true;
  }

  function renderCarouselsSkeleton() {
    if (!carouselHost) return;

    html += '<p class="sub">Loading showcase rentals…</p>';

      html += '<div style="margin-bottom:36px">';
      html += '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px">';
      html += '<h3 style="font-family:Cormorant Garamond,serif;font-size:24px;color:#1A1A18;font-weight:600">' + escapeHtml(c.city) + ', ' + escapeHtml(c.state) + '</h3>';
      html += '<span style="font-size:13px;color:#64748B;flex-shrink:0">Loading…</span>';
      html += '</div>';
      html += '<div class="rhc-carousel-row">';
      for (var i = 0; i < 3; i++) html += skeletonCardHtml('flex:0 0 280px');
      html += '</div></div>';
    });
    carouselHost.innerHTML = html;
  }

  // Helper to open detail page from listing data (not from DOM card)
  function openDetailPageFromData(listing) {
    RHC.currentListing = listing;
    var similar = findSimilarHomes(listing);
    // Reuse the existing openDetailPage but pass a fake card that has the listing data
    var fakeCard = { getAttribute: function() { return listing.id; }, querySelector: function() { return null; }, textContent: '' };
    openDetailPage(fakeCard);

  function applyFiltersToListings(list) {
    if (!Array.isArray(list)) return [];
    var f = RHC.activeFilters;
    var q = (RHC.searchQuery || '').trim().toLowerCase();
    return list.filter(function(l) {
      // Price filter
      var price = parseInt(l.price, 10) || 0;
      if (price > 0) {
        if (price < f.priceMin) return false;
        if (price > f.priceMax) return false;
      }
      // Beds filter (1+ means at least N)
      var beds = parseInt(l.beds, 10) || 0;
      if (beds > 0 && beds < f.beds) return false;
      // Baths filter
      var baths = parseInt(l.baths, 10) || 0;
      if (baths > 0 && baths < f.baths) return false;
      // Pets filter
      if (f.pets) {
        var petsStr = (l.pets || '').toLowerCase();
        if (petsStr.indexOf('no pet') >= 0 || petsStr === 'no pets') return false;
      }
      // Move-in date filter (if listing has availableDate, must be on or before chosen date)
      if (f.moveIn && l.availableDate) {
        try {
          var moveInTs = new Date(f.moveIn).getTime();
          var availTs = (l.availableDate.toMillis) ? l.availableDate.toMillis() : new Date(l.availableDate).getTime();
          if (availTs > moveInTs) return false;
        } catch(e) {}
      }
      // Search query filter (address, city, state, zip, keyword)
      if (q) {
        var hay = [
          l.address || '', l.city || '', l.state || '', l.zip || '', l.zipCode || '',
          l.keyword || '', l.description || '', l.type || ''
        ].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

    if (minSlider) { minSlider.value = 0; document.getElementById('rhc-price-min-val').textContent = '$0'; }
    if (maxSlider) { maxSlider.value = 10000; document.getElementById('rhc-price-max-val').textContent = '$10k+'; }
    if (bedsSel) bedsSel.value = '0';
    if (bathsSel) bathsSel.value = '0';
    if (petsChk) petsChk.checked = false;
    if (moveinInp) moveinInp.value = '';
    applyFiltersAndRender();
    toast('Filters cleared.');
  };

  // ============ FIX D8: hide React bundle's filter pills ============
  function hideReactFilterPills() {
    try {
      // Find elements whose text contains the React bundle's filter pill labels
      var pillTexts = ['Price: Any', 'Beds: Any', 'Baths: Any', 'Type: Any', 'Pets: Any', 'Any Price', 'Any Beds'];
      var candidates = document.querySelectorAll('button, a, div, span');
      for (var i = 0; i < candidates.length; i++) {
        var el = candidates[i];
        // Skip our own filter bar elements
        if (el.closest('#rhc-filter-bar')) continue;
        if (el.closest('.rhc-chat-window')) continue;
        if (el.closest('.rhc-detail-overlay')) continue;
        if (el.closest('.rhc-saved-overlay')) continue;
        if (el.getAttribute('data-rhc-react-pill') === '1') continue;
        var txt = (el.textContent || '').trim();
        if (txt.length === 0 || txt.length > 60) continue;
        var isPill = false;
        for (var j = 0; j < pillTexts.length; j++) {
          if (txt === pillTexts[j] || txt.indexOf(pillTexts[j]) === 0) { isPill = true; break; }
        }
        if (isPill) {
          // Hide the immediate container (which is usually the pill button)
          var pillEl = el.closest('button') || el.closest('a') || el;
          pillEl.setAttribute('data-rhc-react-pill', '1');
          pillEl.style.display = 'none';
        }
      }
    } catch(e) { console.warn('RHC: hideReactFilterPills failed', e); }
  }

  // ============ Search handler (FIX E10) ============
  function setupSearchHandler() {
    // Find the React bundle's "Search Homes" button (text contains "Search Homes")
    var btns = document.querySelectorAll('button');
    var searchBtn = null;
    for (var i = 0; i < btns.length; i++) {
      var txt = (btns[i].textContent || '').trim();
      if (txt.indexOf('Search Homes') >= 0 || txt === 'Search') { searchBtn = btns[i]; break; }
    }
    if (!searchBtn) return false;
    if (searchBtn.getAttribute('data-rhc-search-wired') === '1') return true;
    searchBtn.setAttribute('data-rhc-search-wired', '1');
    // Capture phase so we run before any React onClick handler
    searchBtn.addEventListener('click', function(e) {
      try {
        // Find the search input — usually a sibling input with type=text or no type
        var inputs = document.querySelectorAll('input[type="text"], input[type="search"], input:not([type])');
        var q = '';
        for (var j = 0; j < inputs.length; j++) {
          var inp = inputs[j];
          // Skip inputs inside modals/overlays
          if (inp.closest('.rhc-chat-window') || inp.closest('.rhc-app-card') || inp.closest('.rhc-auth-card')) continue;
          if (inp.value && inp.value.trim()) { q = inp.value.trim(); break; }
        }
        RHC.searchQuery = q;
        // Apply filters + render
        applyFiltersAndRender();
        // Scroll to the "Rentals Across USA" section
        var target = document.getElementById('rhc-other-houses') ||
                     document.getElementById('rhc-filter-bar') ||
                     document.getElementById('listings');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // Toast result count
        var count = applyFiltersToListings(rhcListings).length;
        if (q) {
          if (count > 0) toast('Found ' + count + ' home' + (count === 1 ? '' : 's') + ' matching "' + q + '"');
          else toast('No homes match your search. Try different keywords.');
        }
      } catch(err) {
        console.warn('RHC: search handler failed', err);
      }
    }, true);
    return true;
  }

  // ============ Leaflet map (FIX D9: invalidateSize fix + FIX D10: pin "View homes") ============
  function injectLeafletStyles() {
    if (document.getElementById('rhc-leaflet-css')) return;
    var link = document.createElement('link');
    link.id = 'rhc-leaflet-css';
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
  }

  function initMap() {
    if (rhcMap) {
      // FIX D9: ensure tiles render correctly even on late init
      try { setTimeout(function(){ rhcMap.invalidateSize(); }, 200); } catch(e) {}
      return;
    }
    var mapEl = document.getElementById('rhc-leaflet-map');
    if (!mapEl) return;
    injectLeafletStyles();
    if (typeof L === 'undefined') {
      loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js').then(function() {
        createMap();
      }).catch(function(e) {
        console.warn('RHC: Leaflet JS load failed', e);
        mapEl.innerHTML = '<div style="padding:40px;text-align:center;color:#64748B;font-family:Inter,sans-serif">Map could not load. Please refresh the page.</div>';
      });
    } else {
      createMap();
    }
  }

  function createMap() {
    var mapEl = document.getElementById('rhc-leaflet-map');
    if (!mapEl || rhcMap) return;
    try {
      // Default view: USA center
      rhcMap = L.map(mapEl, { scrollWheelZoom: false }).setView([39.5, -98.35], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
      }).addTo(rhcMap);
      // FIX D9: invalidateSize after a small timeout — fixes tile rendering when map
      // is created inside a previously-hidden or flex container.
      setTimeout(function() {
        try { rhcMap.invalidateSize(); } catch(e) {}
      }, 200);
      // FIX D9: invalidateSize on window resize too
      window.addEventListener('resize', function() {
        try { if (rhcMap) rhcMap.invalidateSize(); } catch(e) {}
      });
      updateMap();
    } catch(e) {
      console.warn('RHC: createMap failed', e);
    }
  }

  function updateMap() {
    if (!rhcMap || typeof L === 'undefined') return;
    try {
      // Clear old markers
      rhcMapMarkers.forEach(function(m) { try { rhcMap.removeLayer(m); } catch(e) {} });
      rhcMapMarkers = [];
      // Group listings by city where showOnMap === true (apply filters too — FIX D8)
      var filtered = applyFiltersToListings(rhcListings);
      var cityMap = {};
      filtered.forEach(function(l) {
        if (!l.showOnMap) return;
        var key = (l.city || '') + ', ' + (l.state || '');
        if (!cityMap[key]) cityMap[key] = { city: l.city, state: l.state, listings: [] };
        cityMap[key].listings.push(l);
      });
      // Place markers
      var group = [];
      Object.keys(cityMap).forEach(function(key) {
        var c = cityMap[key];
        var coords = CITY_COORDS[c.city];
        if (!coords) return;
        var marker = L.marker([coords[0], coords[1]]).addTo(rhcMap);
        // FIX D10: popup has a "View homes" button that filters the grid by city
        var popupHtml = '<div style="font-family:Inter,sans-serif;max-width:250px"><strong style="font-size:15px">' + escapeHtml(c.city) + ', ' + escapeHtml(c.state) + '</strong><br><span style="font-size:12px;color:#64748B">' + c.listings.length + ' rental' + (c.listings.length > 1 ? 's' : '') + ' available</span>';
        c.listings.slice(0, 5).forEach(function(h) {
          popupHtml += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #E8E2D9"><div style="font-weight:600;font-size:13px;color:#1A1A18">' + escapeHtml(h.address || '') + '</div><div style="font-size:12px;color:#0A66FF;font-weight:700">$' + ((h.price || 0).toLocaleString()) + '/mo</div><div style="font-size:11px;color:#64748B">' + (h.beds || 0) + ' bd &bull; ' + (h.baths || 0) + ' ba</div></div>';
        });
        if (c.listings.length > 5) popupHtml += '<div style="margin-top:8px;font-size:12px;color:#64748B">+' + (c.listings.length - 5) + ' more</div>';
        popupHtml += '<button class="rhc-map-popup-btn" onclick="RHC.filterCity(\'' + escapeHtml(c.city).replace(/'/g, '\\\'') + '\')">View homes in ' + escapeHtml(c.city) + '</button>';
        popupHtml += '</div>';
        marker.bindPopup(popupHtml);
        // FIX D10: clicking the marker also filters the grid to that city
        marker.on('click', function() {
          // The popup's "View homes" button handles the explicit filter,
          // but we also pre-filter on marker click so users get instant feedback.
          // (Don't auto-filter on marker click to avoid surprises; rely on button.)
        });
        rhcMapMarkers.push(marker);
        group.push([coords[0], coords[1]]);
      });
      // FIX D9: fitBounds to show all markers
      if (group.length > 0) {
        try {
          if (group.length === 1) {
            rhcMap.setView(group[0], 10);
          } else {
            rhcMap.fitBounds(group, { padding: [40, 40] });
          }
          // Always re-invalidate after fitBounds
          setTimeout(function() { try { rhcMap.invalidateSize(); } catch(e) {} }, 200);
        } catch(e) { console.warn('RHC: fitBounds failed', e); }
      }
    } catch(e) { console.warn('RHC: updateMap failed', e); }
  }

  RHC.filterCity = function(cityName) {
    try {
      RHC.searchQuery = cityName;
      applyFiltersAndRender();
      var l = document.getElementById('rhc-other-houses') || document.getElementById('listings');
      if (l) l.scrollIntoView({ behavior: 'smooth' });
      var count = applyFiltersToListings(rhcListings).length;
      toast('Showing ' + count + ' home' + (count === 1 ? '' : 's') + ' in ' + cityName + '.');
    } catch(e) { console.warn('RHC: filterCity failed', e); }
  };

  // ============ FIX B5: Gallery viewer (full-screen, swipe, arrows, counter, dots, close) ============
  function openGalleryViewer(listing, startIndex) {
    closeGalleryViewer();
    var images = (listing && listing.images && listing.images.length)
      ? listing.images.slice(0)
      : [listingImage(listing, 0)];
    // Ensure at least one image
    if (images.length === 0) images = [DEFAULT_HOUSE_IMG];
    var current = Math.max(0, Math.min(startIndex || 0, images.length - 1));
    var viewer = document.createElement('div');
    viewer.id = 'rhc-gallery-viewer';
    viewer.className = 'rhc-gallery-viewer';
    document.body.appendChild(viewer);
    document.body.style.overflow = 'hidden';

    function render() {
      var dotsHtml = '';
      for (var i = 0; i < images.length; i++) {
        dotsHtml += '<div class="rhc-gallery-viewer-dot' + (i === current ? ' active' : '') + '" data-idx="' + i + '"></div>';
      }
      viewer.innerHTML =
        '<div class="rhc-gallery-viewer-topbar">' +
          '<div class="rhc-gallery-viewer-counter">' + (current + 1) + ' / ' + images.length + '</div>' +
          '<button class="rhc-gallery-viewer-close" aria-label="Close">' + SVG.close + '</button>' +
        '</div>' +
        '<div class="rhc-gallery-viewer-stage">' +
          (images.length > 1 ? '<button class="rhc-gallery-viewer-arrow left" aria-label="Previous">' + SVG.arrowLeft + '</button>' : '') +
          imgTag(images[current], (listing && listing.address) || 'Rental home', 'max-width:90vw;max-height:80vh;object-fit:contain;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)') +
          (images.length > 1 ? '<button class="rhc-gallery-viewer-arrow right" aria-label="Next">' + SVG.arrowRight + '</button>' : '') +
        '</div>' +
        (images.length > 1 ? '<div class="rhc-gallery-viewer-dots">' + dotsHtml + '</div>' : '');

      // Wire close button
      var closeBtn = viewer.querySelector('.rhc-gallery-viewer-close');
      if (closeBtn) closeBtn.addEventListener('click', closeGalleryViewer);

      // Wire arrow buttons (desktop)
      var leftBtn = viewer.querySelector('.rhc-gallery-viewer-arrow.left');
      var rightBtn = viewer.querySelector('.rhc-gallery-viewer-arrow.right');
      if (leftBtn) leftBtn.addEventListener('click', function(e) { e.stopPropagation(); navigate(-1); });
      if (rightBtn) rightBtn.addEventListener('click', function(e) { e.stopPropagation(); navigate(1); });

      // Wire dots
      var dotEls = viewer.querySelectorAll('.rhc-gallery-viewer-dot');
      for (var j = 0; j < dotEls.length; j++) {
        (function(dotEl, idx) {
          dotEl.addEventListener('click', function(e) { e.stopPropagation(); current = idx; render(); });
        })(dotEls[j], parseInt(dotEls[j].getAttribute('data-idx'), 10));
      }

      // Click on backdrop (not image, not buttons) closes
      var stage = viewer.querySelector('.rhc-gallery-viewer-stage');
      if (stage) {
        stage.addEventListener('click', function(e) {
          if (e.target === stage) closeGalleryViewer();
        });
      }
    }

    function navigate(delta) {
      if (images.length <= 1) return;
      current = (current + delta + images.length) % images.length;
      render();
    }

    // Touch swipe support (mobile)
    var touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
    viewer.addEventListener('touchstart', function(e) {
      if (e.changedTouches && e.changedTouches.length) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }
    }, { passive: true });
    viewer.addEventListener('touchend', function(e) {
      if (e.changedTouches && e.changedTouches.length) {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        var dx = touchEndX - touchStartX;
        var dy = touchEndY - touchStartY;
        // Only treat as horizontal swipe if |dx| > |dy| and |dx| > 30px
        if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) navigate(1); // swipe left -> next
          else navigate(-1); // swipe right -> previous
        }
      }
    }, { passive: true });

    // Keyboard navigation
    function onKey(e) {
      if (e.key === 'Escape') { closeGalleryViewer(); }
      else if (e.key === 'ArrowLeft') { navigate(-1); }
      else if (e.key === 'ArrowRight') { navigate(1); }
    }
    document.addEventListener('keydown', onKey);
    viewer._onKey = onKey; // store for cleanup

    render();
  }
  window.RHC.openGalleryViewer = openGalleryViewer;

  function closeGalleryViewer() {
    var v = document.getElementById('rhc-gallery-viewer');
    if (v) {
      if (v._onKey) document.removeEventListener('keydown', v._onKey);
      v.remove();
    }
    document.body.style.overflow = '';
  }
  window.RHC.closeGalleryViewer = closeGalleryViewer;

  // ============ Application modal (FIX E12 + FIX D11: 4-step validation) ============
  function setupApplicationButton() {
    var btns = document.querySelectorAll('button');
    var applyBtn = null;
    for (var i = 0; i < btns.length; i++) {
      var txt = (btns[i].textContent || '').trim();
      if (txt.indexOf('Start Application') >= 0 || txt.indexOf('Apply Now') >= 0) { applyBtn = btns[i]; break; }
    }
    if (!applyBtn) return false;
    if (applyBtn.getAttribute('data-rhc-app-wired') === '1') return true;
    applyBtn.setAttribute('data-rhc-app-wired', '1');
    applyBtn.addEventListener('click', function(e) {
      try {
        e.preventDefault();
        e.stopPropagation();
        showApplicationModal();
      } catch(err) { console.warn('RHC: application button handler failed', err); }
    }, true);
    return true;
  }

  function showApplicationModal() {
    closeApplicationModal();
    var app = { name: '', email: '', phone: '', moveIn: '', occupants: 1, pets: false, notes: '' };
    if (RHC.renter) {
      app.name = RHC.renter.name || '';
      app.email = RHC.renter.email || '';
    }
    var root = document.createElement('div');
    root.id = 'rhc-app-modal';
    root.innerHTML = '<div class="rhc-app-backdrop"><div class="rhc-app-card">' +
      '<button class="rhc-auth-close" aria-label="Close" id="rhc-app-close">' + SVG.close + '</button>' +
      '<div id="rhc-app-body"></div>' +
      '</div></div>';
    document.body.appendChild(root);
    root.querySelector('#rhc-app-close').addEventListener('click', closeApplicationModal);
    root.querySelector('.rhc-app-backdrop').addEventListener('click', function(e) {
      if (e.target === e.currentTarget) closeApplicationModal();
    });
    renderAppStep(1, app);
  }

  function closeApplicationModal() {
    var r = document.getElementById('rhc-app-modal');
    if (r) r.remove();
  }

  function renderAppStep(step, app) {
    var body = document.getElementById('rhc-app-body');
    if (!body) return;
    var totalSteps = 4;
    var dots = '';
    for (var i = 1; i <= totalSteps; i++) {
      var cls = i === step ? 'active' : (i < step ? 'done' : '');
      dots += '<div class="rhc-app-step-dot ' + cls + '"></div>';
    }
    var html = '<div class="rhc-app-steps">' + dots + '</div>';
    if (step === 1) {
      // FIX D11: step 1 requires name + email + phone
      html += '<h2>Tell us about you</h2>';
      html += '<div class="sub">Step 1 of 4 — Personal information (all fields required)</div>';
      html += '<div class="rhc-auth-field"><label>Full name *</label><input id="rhc-app-name" type="text" placeholder="Jane Doe" value="' + escapeHtml(app.name) + '"></div>';
      html += '<div class="rhc-auth-field"><label>Email *</label><input id="rhc-app-email" type="email" placeholder="you@example.com" value="' + escapeHtml(app.email) + '"></div>';
      html += '<div class="rhc-auth-field"><label>Phone *</label><input id="rhc-app-phone" type="tel" placeholder="(555) 123-4567" value="' + escapeHtml(app.phone) + '"></div>';
      html += '<div class="rhc-app-nav"><button class="rhc-app-btn-secondary" id="rhc-app-cancel">Cancel</button>' +
              '<button class="rhc-app-btn-primary" id="rhc-app-next">Next &rarr;</button></div>';
    } else if (step === 2) {
      // FIX D11: step 2 requires move-in date
      html += '<h2>Rental preferences</h2>';
      html += '<div class="sub">Step 2 of 4 — When and how</div>';
      html += '<div class="rhc-auth-field"><label>Preferred move-in date *</label><input id="rhc-app-movein" type="date" value="' + escapeHtml(app.moveIn) + '"></div>';
      html += '<div class="rhc-auth-field"><label>Number of occupants</label><input id="rhc-app-occupants" type="number" min="1" max="20" value="' + escapeHtml(app.occupants) + '"></div>';
      html += '<div class="rhc-auth-field"><label class="rhc-filter-toggle"><input type="checkbox" id="rhc-app-pets" ' + (app.pets ? 'checked' : '') + '> I have pets</label></div>';
      html += '<div class="rhc-app-nav"><button class="rhc-app-btn-secondary" id="rhc-app-back">&larr; Back</button>' +
              '<button class="rhc-app-btn-primary" id="rhc-app-next">Next &rarr;</button></div>';
    } else if (step === 3) {
      // FIX D11: step 3 is optional
      html += '<h2>Anything else?</h2>';
      html += '<div class="sub">Step 3 of 4 — Additional notes (optional)</div>';
      html += '<div class="rhc-auth-field"><label>Tell us about your ideal home, preferred neighborhoods, must-have amenities, or anything else we should know.</label>' +
              '<textarea id="rhc-app-notes" rows="5" placeholder="I\'m looking for a quiet 2-bedroom near public transit with in-unit laundry and parking…">' + escapeHtml(app.notes) + '</textarea></div>';
      html += '<div class="rhc-app-nav"><button class="rhc-app-btn-secondary" id="rhc-app-back">&larr; Back</button>' +
              '<button class="rhc-app-btn-primary" id="rhc-app-next">Review &rarr;</button></div>';
    } else if (step === 4) {
      // FIX D11: step 4 review + submit to Firestore
      html += '<h2>Review and submit</h2>';
      html += '<div class="sub">Step 4 of 4 — Confirm your application</div>';
      html += '<div class="rhc-app-summary">';
      html += '<div class="row"><span class="k">Name</span><span class="v">' + escapeHtml(app.name || '—') + '</span></div>';
      html += '<div class="row"><span class="k">Email</span><span class="v">' + escapeHtml(app.email || '—') + '</span></div>';
      html += '<div class="row"><span class="k">Phone</span><span class="v">' + escapeHtml(app.phone || '—') + '</span></div>';
      html += '<div class="row"><span class="k">Move-in</span><span class="v">' + escapeHtml(app.moveIn || 'Flexible') + '</span></div>';
      html += '<div class="row"><span class="k">Occupants</span><span class="v">' + escapeHtml(String(app.occupants || 1)) + '</span></div>';
      html += '<div class="row"><span class="k">Pets</span><span class="v">' + (app.pets ? 'Yes' : 'No') + '</span></div>';
      html += '<div class="row" style="flex-direction:column;align-items:flex-start;gap:4px"><span class="k">Notes</span><span class="v" style="text-align:left">' + escapeHtml(app.notes || '—') + '</span></div>';
      html += '</div>';
      html += '<div class="rhc-app-nav"><button class="rhc-app-btn-secondary" id="rhc-app-back">&larr; Back</button>' +
              '<button class="rhc-app-btn-primary" id="rhc-app-submit">Submit application</button></div>';
    }
    body.innerHTML = html;

    var root = document.getElementById('rhc-app-modal');
    root.querySelector('#rhc-app-cancel').addEventListener('click', closeApplicationModal);
    if (step > 1) {
      root.querySelector('#rhc-app-back').addEventListener('click', function() {
        if (step === 2) {
          app.moveIn = (document.getElementById('rhc-app-movein') || {}).value || '';
          app.occupants = parseInt((document.getElementById('rhc-app-occupants') || {}).value, 10) || 1;
          app.pets = (document.getElementById('rhc-app-pets') || {}).checked;
        } else if (step === 3) {
          app.notes = (document.getElementById('rhc-app-notes') || {}).value || '';
        } else if (step === 4) {
          // No state to save on back from review
        }
        renderAppStep(step - 1, app);
      });
    }
    if (step < 4) {
      root.querySelector('#rhc-app-next').addEventListener('click', function() {
        if (step === 1) {
          // FIX D11: validate step 1 (name + email + phone required)
          app.name = (document.getElementById('rhc-app-name') || {}).value || '';
          app.email = (document.getElementById('rhc-app-email') || {}).value || '';
          app.phone = (document.getElementById('rhc-app-phone') || {}).value || '';
          if (!app.name.trim()) { toast('Please enter your name.'); return; }
          if (!app.email.trim() || app.email.indexOf('@') < 0) { toast('Please enter a valid email.'); return; }
          if (!app.phone.trim()) { toast('Please enter your phone number.'); return; }
        } else if (step === 2) {
          // FIX D11: validate step 2 (move-in date required)
          app.moveIn = (document.getElementById('rhc-app-movein') || {}).value || '';
          app.occupants = parseInt((document.getElementById('rhc-app-occupants') || {}).value, 10) || 1;
          app.pets = (document.getElementById('rhc-app-pets') || {}).checked;
          if (!app.moveIn.trim()) { toast('Please pick a preferred move-in date.'); return; }
        } else if (step === 3) {
          // Step 3 is optional — just save the notes
          app.notes = (document.getElementById('rhc-app-notes') || {}).value || '';
        }
        renderAppStep(step + 1, app);
      });
    }
    if (step === 4) {
      root.querySelector('#rhc-app-submit').addEventListener('click', function() {
        submitApplication(app);
      });
    }
  }

  async function submitApplication(app) {
    var btn = document.getElementById('rhc-app-submit');
    if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
    try {
      if (!RHC.db) throw new Error('Database not ready');
      var payload = {
        name: app.name || '',
        email: (app.email || '').trim(),
        phone: app.phone || '',
        moveIn: app.moveIn || '',
        occupants: parseInt(app.occupants, 10) || 1,
        pets: !!app.pets,

      if (btn) { btn.disabled = false; btn.textContent = 'Submit application'; }
      toast('Could not submit your application right now. Please try again.');
    }
  }

  // ============ FIX D7: Nav links handler ============
  function setupNavLinks() {
    try {
      var links = document.querySelectorAll('a, button');
      for (var i = 0; i < links.length; i++) {
        var el = links[i];
        if (el.getAttribute('data-rhc-nav-wired') === '1') continue;
        var txt = (el.textContent || '').trim().toLowerCase();
        if (!txt) continue;
        // Skip elements inside our own overlays/chat
        if (el.closest('.rhc-chat-window') || el.closest('.rhc-auth-card') ||
            el.closest('.rhc-app-card') || el.closest('.rhc-legal-card') ||
            el.closest('.rhc-coming-card') || el.closest('.rhc-detail-overlay') ||
            el.closest('.rhc-saved-overlay') || el.closest('#rhc-filter-bar') ||
            el.closest('#rhc-account-btn-wrap') || el.closest('#rhc-mobile-tabbar')) continue;

        var matched = false;
        var action = null;
        if (txt === 'rent' || txt.indexOf('rent a home') === 0 || txt.indexOf('rent homes') === 0) {
          matched = true;
          action = 'rent';
        } else if (txt.indexOf('mortgage') >= 0) {
          matched = true;
          action = 'mortgage';
        } else if (txt.indexOf('find an agent') >= 0 || txt === 'agents' || txt.indexOf('find agent') >= 0) {
          matched = true;
          action = 'agent';
        } else if (txt.indexOf('manage rentals') >= 0 || txt === 'manage' || txt.indexOf('manage rental') >= 0) {
          matched = true;
          action = 'manage';
        } else if (txt.indexOf('advertise') >= 0) {
          matched = true;
          action = 'advertise';
        } else if (txt === 'get help' || txt.indexOf('help center') === 0 || txt.indexOf('get help') === 0) {
          matched = true;
          action = 'help';
        }

        if (matched) {
          el.setAttribute('data-rhc-nav-wired', '1');
          (function(theEl, theAction) {
            theEl.addEventListener('click', function(e) {
              try {
                if (theAction === 'rent') {
                  e.preventDefault();
                  var t = document.getElementById('rhc-city-carousels') ||
                          document.getElementById('rhc-other-houses') ||
                          document.getElementById('listings');
                  if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else if (theAction === 'mortgage') {
                  e.preventDefault();
                  showComingSoon('Mortgage services coming soon',
                    'Mortgage services coming soon. Contact us at <a href="mailto:rentalhomeconnects@gmail.com">rentalhomeconnects@gmail.com</a> to be notified when we launch.',
                    SVG.dollar);
                } else if (theAction === 'agent') {
                  e.preventDefault();
                  var footer = document.getElementById('rhc-footer-contact-host') ||
                               document.querySelector('footer');
                  if (footer) footer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                  else toast('Scroll down to find our agents\' contact info.');
                } else if (theAction === 'manage') {
                  // Don't preventDefault — let the link navigate to admin.html naturally
                  // but if there's no href, open admin.html in new tab
                  var href = theEl.getAttribute('href');
                  if (!href || href === '#' || href === 'javascript:void(0)') {
                    e.preventDefault();
                    window.open('admin.html', '_blank', 'noopener');
                  }
                } else if (theAction === 'advertise') {
                  e.preventDefault();
                  showComingSoon('Advertising opportunities coming soon',
                    'Advertising opportunities coming soon. Email <a href="mailto:rentalhomeconnects@gmail.com">rentalhomeconnects@gmail.com</a>.',
                    SVG.megaphone);
                } else if (theAction === 'help') {
                  e.preventDefault();
                  openChatWidget();
                }
              } catch(err) { console.warn('RHC: nav link action failed', err); }
            }, true);
          })(el, action);
        }
      }
    } catch(e) { console.warn('RHC: setupNavLinks failed', e); }
  }

  // ============ Favorites (FIX E14: persistence localStorage + Firestore) ============
  async function toggleFavorite(listingId, heartBtn) {
    if (!listingId) return;
    var idx = RHC.savedHomes.indexOf(listingId);
    if (idx >= 0) {
      RHC.savedHomes.splice(idx, 1);
      if (heartBtn) {
        heartBtn.classList.remove('saved');
        heartBtn.innerHTML = SVG.heartOutline;
      }
      toast('Removed from saved homes.');
      if (RHC.renter && RHC.db) {
        try { await RHC.db.collection('renters').doc(RHC.renter.uid).collection('saved').doc(listingId).delete(); }
        catch(e) { console.warn('RHC: unsave remote failed', e); }
      }
    } else {
      RHC.savedHomes.push(listingId);
      if (heartBtn) {
        heartBtn.classList.add('saved');
        heartBtn.innerHTML = SVG.heart;
      }
      toast('Saved! Find it in your Saved Homes.');
      if (RHC.renter && RHC.db) {
        try {
          await RHC.db.collection('renters').doc(RHC.renter.uid).collection('saved').doc(listingId)
            .set({ savedAt: RHC.fb.firestore.FieldValue.serverTimestamp() }, { merge: true });
        } catch(e) { console.warn('RHC: save remote failed', e); }
      }
    }
    localStorage.setItem('rhc_saved_homes', JSON.stringify(RHC.savedHomes));
    refreshHeartIcons();
  }

  function refreshHeartIcons() {
    try {
      var hearts = document.querySelectorAll('.rhc-fav-btn');
      for (var i = 0; i < hearts.length; i++) {
        var h = hearts[i];
        var card = h.closest('[data-rhc-listing-id]');
        if (!card) continue;
        var id = card.getAttribute('data-rhc-listing-id');
        var isSaved = RHC.savedHomes.indexOf(id) >= 0;
        h.classList.toggle('saved', isSaved);
        h.innerHTML = isSaved ? SVG.heart : SVG.heartOutline;
      }
    } catch(e) { console.warn('RHC: refreshHeartIcons failed', e); }
  }

  // ============ Heart icon injection (MutationObserver) — FIX D9: target BOTH selectors ============
  var heartObserver = null;
  function setupHeartObserver() {
    if (heartObserver) return;
    try {
      heartObserver = new MutationObserver(function() { injectHeartIcons(); });
      heartObserver.observe(document.body, { childList: true, subtree: true });
    } catch(e) { console.warn('RHC: heart MutationObserver failed', e); }
    injectHeartIcons();
  }

  function injectHeartIcons() {
    try {
      // FIX D9: target BOTH .group.cursor-pointer AND .rhc-listing-card
      var cards = document.querySelectorAll('.rhc-listing-card, .group.cursor-pointer, [class*="group"][class*="cursor-pointer"]');
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        if (card.querySelector('.rhc-fav-btn')) continue;
        var img = card.querySelector('img');
        if (!img) continue;
        var listingId = card.getAttribute('data-rhc-listing-id');
        if (!listingId) {
          var priceText = card.textContent || '';
          if (priceText.indexOf('/mo') < 0 && priceText.indexOf('$') < 0) continue;
          listingId = extractListingId(card);
          card.setAttribute('data-rhc-listing-id', listingId);
        }
        var cardStyle = window.getComputedStyle(card);
        if (cardStyle.position === 'static') card.style.position = 'relative';
        var heart = document.createElement('button');
        var isSaved = RHC.savedHomes.indexOf(listingId) >= 0;
        heart.className = 'rhc-fav-btn' + (isSaved ? ' saved' : '');
        heart.innerHTML = isSaved ? SVG.heart : SVG.heartOutline;
        heart.setAttribute('aria-label', 'Save home');
        (function(theCard, theHeart, theId) {
          // FIX D9: heart click uses stopPropagation so it doesn't trigger card click
          theHeart.addEventListener('click', function(e) {
            e.preventDefault(); e.stopPropagation();
            toggleFavorite(theId, theHeart);
          });
          // FIX D9: capture-phase click handler on the card -> openDetailPage
          theCard.addEventListener('click', function(e) {
            if (e.target.closest('.rhc-fav-btn')) return;
            e.preventDefault(); e.stopPropagation();
            openDetailPage(theCard);
          }, true);
        })(card, heart, listingId);
        var imgContainer = img.parentElement;
        if (imgContainer) {
          imgContainer.style.position = 'relative';
          imgContainer.appendChild(heart);
        }
      }
    } catch(e) { console.warn('RHC: injectHeartIcons failed', e); }
  }

  function extractListingId(card) {
    var txt = card.textContent || '';
    var addrMatch = txt.match(/(\d+\s+[A-Za-z\s]+(?:St|Ave|Blvd|Ln|Dr|Rd|Way|Ct|Pl|Ridge))/);
    var priceMatch = txt.match(/\$([\d,]+)/);
    if (addrMatch) return addrMatch[1].trim().toLowerCase().replace(/\s+/g, '-');
    if (priceMatch) return 'home-' + priceMatch[1].replace(/,/g, '');
    return 'home-' + Math.random().toString(36).slice(2, 10);
  }

  function extractListingData(card) {
    var txt = (card.textContent || '').trim();
    var img = card.querySelector('img');
    var imgUrl = img ? (img.src || '') : '';
    var priceMatch = txt.match(/\$([\d,]+)\s*\/mo/);
    var price = priceMatch ? parseInt(priceMatch[1].replace(/,/g, ''), 10) : 0;
    var lines = txt.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    var address = '';
    for (var i = 0; i < lines.length; i++) {
      var L = lines[i];
      if (L.indexOf('$') === 0 || /^(CONDO|HOUSE|TOWNHOUSE|APARTMENT|STUDIO)/.test(L)) continue;
      if (/^\d+\s+[A-Z]/.test(L)) { address = L; break; }
    }
    if (!address && lines.length > 1) address = lines[1];
    var bedsMatch = txt.match(/(\d+)\s*bd/);
    var bathsMatch = txt.match(/(\d+)\s*ba/);
    var sqftMatch = txt.match(/([\d,]+)\s*sqft/);
    var beds = bedsMatch ? parseInt(bedsMatch[1], 10) : 0;
    var baths = bathsMatch ? parseInt(bathsMatch[1], 10) : 0;
    var sqft = sqftMatch ? parseInt(sqftMatch[1].replace(/,/g, ''), 10) : 0;
    var type = 'House';
    if (txt.indexOf('CONDO') >= 0) type = 'Condo';
    else if (txt.indexOf('TOWNHOUSE') >= 0) type = 'Townhouse';
    else if (txt.indexOf('APARTMENT') >= 0) type = 'Apartment';
    else if (txt.indexOf('STUDIO') >= 0) type = 'Studio';
    var cityMatch = txt.match(/([A-Z][a-zA-Z\s]+),\s([A-Z]{2})/);
    var city = cityMatch ? cityMatch[1].trim() : '';
    var state = cityMatch ? cityMatch[2].trim() : '';
    // FIX D11: use type-specific fallback image if no images array
    var fallbackImg = imgUrl || getDefaultImageForType(type);
    return {
      id: card.getAttribute('data-rhc-listing-id') || extractListingId(card),
      img: fallbackImg,
      images: [fallbackImg, getDefaultImageForType(type), getDefaultImageForType(type), getDefaultImageForType(type)],
      price: price, beds: beds, baths: baths, sqft: sqft,
      address: address, city: city, state: state, type: type,
      amenities: ['Central AC','In-unit Laundry','Hardwood Floors','Stainless Appliances','Walk-in Closet','Private Patio','Garage','EV Charger'].slice(0, 4 + (price % 3)),
      description: 'Stunning ' + type.toLowerCase() + ' in the heart of ' + (city || 'this vibrant neighborhood') + '. Floor-to-ceiling windows, chef\'s kitchen with quartz countertops, and a serene primary suite with spa bathroom. Walk to parks, cafes, and transit. Available now with flexible lease terms.',
      yearBuilt: 1998 + (price % 26),
      pets: price % 3 === 0 ? 'Cats & Dogs' : (price % 3 === 1 ? 'Cats Only' : 'No Pets'),
      parking: price % 3 === 0 ? '2-car garage' : (price % 3 === 1 ? '1-car garage + driveway' : 'Street + permit')
    };
  }

  // ============ Property detail page ============
  function openDetailPage(card) {
    var listingId = card.getAttribute('data-rhc-listing-id');
    var listing = null;
    // Try cached rhcListings first
    if (listingId && rhcListings.length > 0) {
      for (var i = 0; i < rhcListings.length; i++) {
        if (rhcListings[i].id === listingId) { listing = rhcListings[i]; break; }
      }
    }
    if (!listing) listing = extractListingData(card);
    RHC.currentListing = listing;
    // Update URL so refresh stays on this property
    if (listingId) history.pushState(null, '', '#property/' + listingId);
    // FIX 1: Fetch fresh listing data from Firestore BEFORE rendering gallery
    // This ensures correct images on first load — no stale cache
    if (listingId && RHC.db) {
      RHC.db.collection('listings').doc(listingId).get().then(function(doc) {
        if (doc.exists) {
          var freshData = Object.assign({ id: doc.id }, doc.data());
          // Update cached rhcListings
          for (var i = 0; i < rhcListings.length; i++) {
            if (rhcListings[i].id === listingId) { rhcListings[i] = freshData; break; }
          }
          RHC.currentListing = freshData;
          // Re-render the gallery with correct images
          var galleryContainer = document.querySelector('.rhc-detail-gallery');
          if (galleryContainer) {
            galleryContainer.outerHTML = buildGalleryHtml(freshData);
          }
          // Update similar homes with fresh data
          var similarContainer = document.querySelector('.rhc-similar');
          if (similarContainer) {
            var similar = findSimilarHomes(freshData);
            var similarHtml = similar.length > 0 ? similar.map(function(h) {
              return '<div class="rhc-similar-card" onclick="RHC.openDetailById(\'' + escapeHtml(h.id) + '\')">' +
                imgTag(h.img, (h.address || 'Rental home'), 'width:100%;height:140px;object-fit:cover') +
                '<div class="info"><div class="price">$' + (h.price || 0).toLocaleString() + '/mo</div>' +
                '<div class="addr">' + escapeHtml(h.address || '') + '</div>' +
                '<div class="specs">' + (h.beds || 0) + ' bd - ' + (h.baths || 0) + ' ba - ' + (h.sqft || 0).toLocaleString() + ' sqft</div>' +
                '</div></div>';
            }).join('') : '<p style="color:#64748B;font-size:14px">No similar homes found.</p>';
            similarContainer.innerHTML = similarHtml;
          }
        }
      }).catch(function(e) { console.warn('RHC: fresh fetch failed, using cached', e); });
    }
    var similar = findSimilarHomes(listing);

    var overlay = document.createElement('div');
    overlay.id = 'rhc-detail-overlay';
    overlay.className = 'rhc-detail-overlay';
    var galleryHtml = buildGalleryHtml(listing);
    var amenitiesHtml = (listing.amenities || []).map(function(a) {
      var icon = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';

  // FIX B5: buildGalleryHtml — every image (main + thumbnails + "+N" tile) gets onclick -> openGalleryViewer
  function buildGalleryHtml(listing) {
    var allImgs = listing.images && listing.images.length ? listing.images : [listingImage(listing, 0)];
    // Support up to 6 images
    var imgs = allImgs.slice(0, 6);
    while (imgs.length < 2) {
      imgs.push(getDefaultImageForType(listing.type));
    }
    var main = imgs[0] || DEFAULT_HOUSE_IMG;
    var html = '<div class="rhc-detail-gallery">' +
      '<div class="rhc-detail-gallery-main" onclick="RHC.openGalleryViewer(RHC.currentListing, 0)">' +
        imgTag(main, listing.address, 'width:100%;height:100%;object-fit:cover') +
      '</div>';
    if (imgs.length > 1) {
      html += '<div class="rhc-detail-gallery-thumbs">';
      for (var i = 1; i < Math.min(3, imgs.length); i++) {
        html += '<div class="rhc-detail-gallery-thumb" onclick="RHC.openGalleryViewer(RHC.currentListing, ' + i + ')">' +
          imgTag(imgs[i], listing.address, 'width:100%;height:100%;object-fit:cover') +
        '</div>';
      }
      if (imgs.length > 3) {
        html += '<div class="rhc-detail-gallery-thumb" onclick="RHC.openGalleryViewer(RHC.currentListing, 3)" style="position:relative">' +
          imgTag(imgs[3] || imgs[2] || main, listing.address, 'width:100%;height:100%;object-fit:cover') +
          '<div class="rhc-detail-gallery-more">+' + (imgs.length - 3) + ' more</div>' +
        '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function findSimilarHomes(currentListing) {
    // Look up similar homes directly from rhcListings (Firestore source of truth)
    var similar = [];
    if (rhcListings && rhcListings.length) {
      for (var i = 0; i < rhcListings.length; i++) {
        var l = rhcListings[i];
        if (l.id === currentListing.id) continue;
        if ((l.city || '') === (currentListing.city || '') && similar.length < 4) {
          similar.push({
            id: l.id || '',
            img: (l.images && l.images[0]) || getDefaultImageForType(l.type),
            price: l.price || 0,
            address: l.address || '',
            beds: l.beds || 0,
            baths: l.baths || 0,
            sqft: l.sqft || 0
          });
        }
      }
    }
    // Fall back to DOM-parsed cards if Firestore is empty
    if (similar.length < 4) {
      var cards = document.querySelectorAll('[data-rhc-listing-id]');
      for (var j = 0; j < cards.length; j++) {
        var d = extractListingData(cards[j]);
        if (d.id !== currentListing.id && similar.findIndex(function(s){return s.id === d.id;}) < 0) {
          similar.push(d);
          if (similar.length >= 4) break;
        }
      }
    }
    return similar.slice(0, 4);
  }

  RHC.contactAgent = function(address) {

    setTimeout(function() {
      var msg = "Hi, I'm interested in " + address + ". Is it still available? I'd like to schedule a tour.";
      prefillChat(msg);
      if (RHC.currentChatId) sendVisitorMessage(msg);
    }, 400);
  };

  // Schedule Tour: reads date + time from the detail page, opens chat with pre-filled message
  RHC.scheduleTour = function(address) {
    var dateInput = document.getElementById('rhc-tour-date');
    var timeSelect = document.getElementById('rhc-tour-time');
    if (!dateInput || !dateInput.value) {
      toast('Please pick a date for your tour.');
      return;
    }
    var date = dateInput.value;
    var time = timeSelect ? timeSelect.value : 'Morning (9am-12pm)';
    // Format the date nicely
    var dateObj = new Date(date + 'T00:00:00');
    var formattedDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    RHC.closeDetail();
    var fab = document.querySelector('.rhc-chat-fab');
    if (fab && !chatOpen) fab.click();
    setTimeout(function() {
      var msg = "Hi! I'd like to schedule a tour of " + address + " on " + formattedDate + " — " + time + ". What times are available?";
      prefillChat(msg);
      if (RHC.currentChatId) sendVisitorMessage(msg);
    }, 400);
  };

  function renderSavedHomesGrid() {
    var grid = document.getElementById('rhc-saved-grid');
    var empty = document.getElementById('rhc-saved-empty');
    var count = document.getElementById('rhc-saved-count');
    if (!grid) return;
    if (RHC.savedHomes.length === 0) {
      grid.style.display = 'none'; empty.style.display = 'block'; count.textContent = '';
      return;
    }
    grid.style.display = 'grid'; empty.style.display = 'none';
    count.textContent = RHC.savedHomes.length + ' saved';
    grid.innerHTML = RHC.savedHomes.map(function(id) {
      // Try to find the full listing from Firestore cache first
      var listing = null;
      if (rhcListings && rhcListings.length) {
        for (var i = 0; i < rhcListings.length; i++) {
          if (rhcListings[i].id === id) { listing = rhcListings[i]; break; }
        }
      }
      if (listing) {
        var img = (listing.images && listing.images[0]) || getDefaultImageForType(listing.type);
        return '<div class="rhc-saved-card" onclick="RHC.openDetailById(\'' + escapeHtml(id) + '\')">' +
          imgTag(img, (listing.address || 'Saved home'), 'width:100%;height:160px;object-fit:cover') +
          '<div class="body"><div class="price">$' + ((listing.price || 0).toLocaleString()) + '/mo</div>' +
          '<div class="addr">' + escapeHtml(listing.address || '') + '</div>' +
          '<div class="specs">' + (listing.beds || 0) + ' bd - ' + (listing.baths || 0) + ' ba - ' + ((listing.sqft || 0).toLocaleString()) + ' sqft</div>' +
          '<button class="rhc-account-btn ghost" style="font-size:11px;padding:4px 10px;height:auto;margin-top:6px" onclick="event.stopPropagation();RHC.removeSaved(\'' + escapeHtml(id) + '\')">Remove</button>' +
          '</div></div>';
      }
      // Fallback: find card in DOM
      var card;
      try { card = document.querySelector('[data-rhc-listing-id="' + CSS.escape(id) + '"]'); } catch(e) { card = null; }
      if (card) {
        var d = extractListingData(card);
        return '<div class="rhc-saved-card" onclick="RHC.openDetailById(\'' + escapeHtml(id) + '\')">' +
          imgTag(d.img, (d.address || 'Saved home'), 'width:100%;height:160px;object-fit:cover') +
          '<div class="body"><div class="price">$' + (d.price || 0).toLocaleString() + '/mo</div>' +

          '<button class="rhc-account-btn ghost" style="font-size:11px;padding:4px 10px;height:auto;margin-top:6px" onclick="event.stopPropagation();RHC.removeSaved(\'' + escapeHtml(id) + '\')">Remove</button>' +
          '</div></div>';

        '</div></div>';

  RHC.removeSaved = async function(id) {
    RHC.savedHomes = RHC.savedHomes.filter(function(x) { return x !== id; });

      catch(e) { console.warn('RHC: unsave remote failed', e); }
    }
    renderSavedHomesGrid();
    refreshHeartIcons();
  };

      fields.innerHTML = '<div class="rhc-auth-field"><label>Name</label><input id="rhc-auth-name" type="text" placeholder="Jane Doe"></div>' +
        '<div class="rhc-auth-field"><label>Email</label><input id="rhc-auth-email" type="email" placeholder="you@example.com"></div>' +
        '<div class="rhc-auth-field"><label>Password</label><input id="rhc-auth-pass" type="password" placeholder="At least 6 characters"></div>';

  function showAuthError(msg) {
    var el = document.getElementById('rhc-auth-error');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
  }

  function closeAuthModal() {
    var root = document.getElementById('rhc-auth-modal');
    if (root) root.remove();
  }

  async function doSignUp() {
    var name = (document.getElementById('rhc-auth-name') || {}).value || '';
    var email = (document.getElementById('rhc-auth-email') || {}).value || '';
    var pass = (document.getElementById('rhc-auth-pass') || {}).value || '';
    if (!name || !email || !pass) { showAuthError('Please fill in all fields.'); return; }
    if (pass.length < 6) { showAuthError('Password must be at least 6 characters.'); return; }
    var btn = document.getElementById('rhc-auth-submit');
    btn.disabled = true; btn.textContent = 'Creating...';
    try {
      var methods = [];
      try {
        var result = await RHC.auth.fetchSignInMethodsForEmail(email.trim());
        methods = result || [];
      } catch(e) {
        console.warn('RHC: fetchSignInMethodsForEmail failed (continuing with createUser)', e);
      }
      if (methods.length > 0) {
        showAuthError('This email is already registered. Try signing in instead.');
        return;
      }
      var cred = await RHC.auth.createUserWithEmailAndPassword(email.trim(), pass);
      await RHC.db.collection('renters').doc(cred.user.uid).set({
        email: email.trim(), name: name.trim(),
        createdAt: RHC.fb.firestore.FieldValue.serverTimestamp()
      });
      RHC.renter = { uid: cred.user.uid, email: email.trim(), name: name.trim() };
      localStorage.setItem('rhc_renter_cache', JSON.stringify(RHC.renter));
      closeAuthModal();
      toast('Welcome, ' + name.trim().split(' ')[0] + '! Your account is ready.');
      updateAccountButton();
      if (RHC.savedHomes.length > 0) {
        for (var i = 0; i < RHC.savedHomes.length; i++) {
          try {
            await RHC.db.collection('renters').doc(cred.user.uid).collection('saved').doc(RHC.savedHomes[i])
              .set({ savedAt: RHC.fb.firestore.FieldValue.serverTimestamp() }, { merge: true });
          } catch(e) { console.warn('RHC: sync saved home failed', e); }
        }
      }
    } catch (err) {
      console.error('RHC: signUp failed', err);
      var msg = 'Could not create account. Please try again.';
      if (err && err.code === 'auth/email-already-in-use') msg = 'This email is already registered. Try signing in instead.';
      else if (err && err.code === 'auth/invalid-email') msg = 'That email address looks invalid.';
      else if (err && err.code === 'auth/weak-password') msg = 'Password is too weak. Use at least 6 characters.';
      else if (err && err.code === 'auth/network-request-failed') msg = 'Network issue. Check your connection.';
      showAuthError(msg);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  }

  async function doSignIn() {
    var email = (document.getElementById('rhc-auth-email') || {}).value || '';
    var pass = (document.getElementById('rhc-auth-pass') || {}).value || '';
    if (!email || !pass) { showAuthError('Please enter your email and password.'); return; }
    var btn = document.getElementById('rhc-auth-submit');
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      await RHC.auth.signInWithEmailAndPassword(email.trim(), pass);
      closeAuthModal();
      toast('Signed in. Welcome back!');
    } catch (err) {
      console.error('RHC: signIn failed', err);
      var msg = 'Could not sign in. Please try again.';
      if (err && (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')) msg = 'Incorrect email or password.';
      else if (err && err.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
      else if (err && err.code === 'auth/network-request-failed') msg = 'Network issue. Check your connection.';
      showAuthError(msg);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  async function signInWithGoogle() {
    var btn = document.getElementById('rhc-google-btn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" style="animation:rhcSpin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-dasharray="40 20"/></svg> Connecting...'; }
    try {
      var provider = new RHC.fb.auth.GoogleAuthProvider();
      var cred = await RHC.auth.signInWithPopup(provider);
      var doc = await RHC.db.collection('renters').doc(cred.user.uid).get();
      if (!doc.exists) {
        await RHC.db.collection('renters').doc(cred.user.uid).set({
          email: cred.user.email || '',
          name: cred.user.displayName || (cred.user.email || '').split('@')[0],
          photoURL: cred.user.photoURL || '',
          createdAt: RHC.fb.firestore.FieldValue.serverTimestamp()
        });
      }
      closeAuthModal();
      toast('Signed in with Google. Welcome!');
    } catch (err) {
      console.error('RHC: googleSignIn failed', err);
      var msg = 'Could not sign in with Google. Please try again.';
      if (err && err.code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled.';
      else if (err && err.code === 'auth/cancelled-popup-request') msg = 'Sign-in cancelled.';
      else if (err && err.code === 'auth/network-request-failed') msg = 'Network issue. Check your connection.';
      showAuthError(msg);
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>Continue with Google';
      }
    }
  }

  async function signOutRenter() {
    try { await RHC.auth.signOut(); } catch(e) { console.warn('RHC: signOut failed', e); }

    localStorage.removeItem('rhc_renter_cache');

  // ============ Account button ============
  function injectAccountButton() {
    var existing = document.getElementById('rhc-account-btn-wrap');
    if (existing) { updateAccountButton(); return true; }
    var headerBtns = document.querySelectorAll('button');
    var target = null;
    for (var i = 0; i < headerBtns.length; i++) {
      var t = headerBtns[i].textContent || '';
      if (t.indexOf('Start Application') >= 0 || t.indexOf('Apply Now') >= 0) { target = headerBtns[i]; break; }
    }
    if (!target) {
      var hamburger = document.querySelector('button[aria-label="Open menu"]');
      if (hamburger) target = hamburger;
    }
    if (!target) return false;
    var wrap = document.createElement('div');
    wrap.id = 'rhc-account-btn-wrap';
    wrap.style.cssText = 'display:inline-flex;align-items:center;position:relative;margin-right:8px';
    wrap.innerHTML = '<button class="rhc-account-btn ghost" id="rhc-account-btn">' + SVG.user + ' <span>Sign In</span></button>';
    target.parentElement.insertBefore(wrap, target);
    document.getElementById('rhc-account-btn').addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation();
      if (RHC.renter) {
        var menu = document.getElementById('rhc-account-menu');
        if (menu) { menu.remove(); return; }
        menu = document.createElement('div');
        menu.id = 'rhc-account-menu';
        menu.className = 'rhc-account-menu';
        menu.innerHTML = '<div style="padding:10px 12px;border-bottom:1px solid #E8E2D9">' +
          '<div style="font-weight:600;color:#1A1A18;font-size:13px">' + escapeHtml(RHC.renter.name || 'Account') + '</div>' +
          '<div style="font-size:11px;color:#64748B">' + escapeHtml(RHC.renter.email || '') + '</div>' +
        '</div>' +
        '<a id="rhc-menu-saved">' + SVG.heart + ' Saved Homes</a>' +
        '<a id="rhc-menu-signout">' + SVG.arrowLeft + ' Sign Out</a>';
        wrap.appendChild(menu);
        document.getElementById('rhc-menu-saved').addEventListener('click', function() { menu.remove(); showSavedHomesPage(); });
        document.getElementById('rhc-menu-signout').addEventListener('click', function() { menu.remove(); signOutRenter(); });
        setTimeout(function() {
          document.addEventListener('click', function closeMenu(ev) {
            if (!wrap.contains(ev.target)) { menu.remove(); document.removeEventListener('click', closeMenu); }
          });
        }, 10);
      } else { showAuthModal('signin'); }
    });
    updateAccountButton();
    return true;
  }

  function updateAccountButton() {
    var btn = document.getElementById('rhc-account-btn');
    if (!btn) return;

    if (RHC.renter) {
      btn.classList.remove('ghost');

    } else {
      btn.classList.add('ghost');
      label.textContent = 'Sign In';
    }
  }

  // ============ Chat widget (pulse, SVG avatars, send button fix) ============
  var widget = null, chatPanel = null, chatMessages = null, chatInput = null, chatOpen = false;

  function scrollToId(id) {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }
  function scrollToFooter() {
    var f = document.getElementById('rhc-footer-contact-host') ||
            document.querySelector('footer');

  }
  function openChatWidget() {
    var fab = document.querySelector('.rhc-chat-fab');
