  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function initFirebase() {
    try {
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
      RHC.fb = firebase;
      RHC.fb.initializeApp(fbConfig);
      RHC.db = RHC.fb.firestore();
      RHC.auth = RHC.fb.auth();
      RHC.auth.setPersistence(RHC.fb.auth.Auth.Persistence.LOCAL).catch(function(){});
      if (!RHC.auth.currentUser) {
        try { await RHC.auth.signInAnonymously(); } catch(e) { console.warn('anon auth failed', e); }
      }
      // Load branding from Firestore
      try {
        var doc = await RHC.db.collection('settings').doc('branding').get();
        if (doc.exists) RHC.branding = Object.assign(RHC.branding, doc.data());
      } catch(e) { console.warn('branding load', e); }
      try {
        var doc = await RHC.db.collection('settings').doc('social').get();
        if (doc.exists) RHC.branding = Object.assign(RHC.branding, doc.data());
      } catch(e) { console.warn('social load', e); }
      updateFooterContact();
      if (RHC.currentChatId) listenToChat(RHC.currentChatId);
    } catch (e) {
      console.warn('RHC firebase init failed:', e);
    }
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"\']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ============ Replace 'RENTAL HOME CONNECT' text with logo image ============
  // React renders the brand text as: <div class="font-display...">RENTAL HOME <span>CONNECT</span></div>
  // We use a MutationObserver to find this div whenever React re-renders and
  // replace its content with our logo image + attach a triple-click handler.

  var logoClickTimes = [];
  var logoInjected = false;

  function injectLogo() {
    // Find all elements with the brand text
    var candidates = document.querySelectorAll('div.font-display');
    var brandEl = null;
    for (var i = 0; i < candidates.length; i++) {
      var el = candidates[i];
      var txt = el.textContent || '';
      if (txt.indexOf('RENTAL HOME') >= 0 && txt.indexOf('CONNECT') >= 0 && el.children.length <= 2) {
        brandEl = el; break;
      }
    }
    if (!brandEl) return false;
    if (brandEl.getAttribute('data-rhc-logo') === '1') return true; // already injected

    // Replace text with logo image
    brandEl.innerHTML = '<img src="' + RHC_LOGO_URL + '" alt="Rental Home Connect" style="height:38px;width:auto;object-fit:contain;cursor:pointer" loading="eager">';
    brandEl.setAttribute('data-rhc-logo', '1');
    brandEl.style.cursor = 'pointer';

    // Triple-click handler
    brandEl.addEventListener('click', function(e) {
      var now = Date.now();
      logoClickTimes.push(now);
      logoClickTimes = logoClickTimes.filter(function(t) { return now - t < 2000; });
      if (logoClickTimes.length >= 3) {
        logoClickTimes = [];
        e.preventDefault();
        e.stopPropagation();
        window.open('admin.html', '_blank');
      }
    });
    // Also long-press for mobile (1.5s hold)
    var pressTimer = null;
    brandEl.addEventListener('touchstart', function(e) {
      pressTimer = setTimeout(function() {
        e.preventDefault();
        window.open('admin.html', '_blank');
      }, 1500);
    });
    brandEl.addEventListener('touchend', function() { if (pressTimer) clearTimeout(pressTimer); });
    brandEl.addEventListener('touchmove', function() { if (pressTimer) clearTimeout(pressTimer); });

    logoInjected = true;
    return true;
  }

  // Use MutationObserver to re-inject logo whenever React re-renders
  var logoObserver = new MutationObserver(function() {
    if (!logoInjected || !document.querySelector('div.font-display[data-rhc-logo="1"]')) {
      injectLogo();
    }
  });

  // Helper for visitor to filter the React app's city dropdown
  RHC.filterCity = function(cityName) {
    // Try to find the city filter <select> in the React app and set its value
    var selects = document.querySelectorAll('select');
    for (var i = 0; i < selects.length; i++) {
      var opts = selects[i].options;
      for (var j = 0; j < opts.length; j++) {
        if (opts[j].text.indexOf(cityName) >= 0 || opts[j].value.indexOf(cityName) >= 0) {
          selects[i].value = opts[j].value;
          selects[i].dispatchEvent(new Event('change', { bubbles: true }));
          // Scroll to listings
          var l = document.getElementById('listings');
          if (l) l.scrollIntoView({ behavior: 'smooth' });
          return;
        }
      }
    }
    // Fallback: just scroll to listings
    var l = document.getElementById('listings');
    if (l) l.scrollIntoView({ behavior: 'smooth' });
  };

  // ============ Cloudinary upload (for visitor image attachments) ============
  async function uploadImage(file) {
    var fd = new FormData();
    fd.append('file', file, file.name || ('visitor-' + Date.now() + '.jpg'));
    fd.append('upload_preset', RHC.uploadPreset);
    fd.append('folder', 'rhc-chat');
    var res = await fetch('https://api.cloudinary.com/v1_1/' + RHC.cloudName + '/image/upload', {
      method: 'POST', body: fd
    });
    if (!res.ok) throw new Error('Upload failed: ' + res.status);
    var data = await res.json();
    if (!data.secure_url) throw new Error('No URL returned');
    return data.secure_url;
  }

  function compressImage(file, maxDim) {
    return new Promise(function(resolve, reject) {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function(b) { b ? resolve(b) : reject(new Error('compress fail')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function() { reject(new Error('img load fail')); };
      img.src = URL.createObjectURL(file);
    });
  }

  function showChatWidget() {
    if (widget) { chatOpen = true; chatPanel.style.display = 'flex'; return; }
    injectChatStyles();
    widget = document.createElement('div');
    widget.innerHTML = '<button class="rhc-chat-fab" aria-label="Open chat"><i class="fa-solid fa-comment-dots"></i><span class="badge hidden" id="rhc-unread">0</span></button>' +
      '<div class="rhc-chat-window" style="display:none">' +
        '<div class="rhc-chat-header"><div class="avatar"><i class="fa-solid fa-headset"></i></div>' +
          '<div><div class="title">Rental Home Connect</div><div class="sub"><i class="fa-solid fa-circle" style="font-size:7px;color:#34D399"></i> Online now</div></div>' +
          '<button class="close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>' +
        '<div class="rhc-chat-messages" id="rhc-messages"></div>' +
        '<div class="rhc-typing" id="rhc-typing"><span class="dots"><span></span><span></span><span></span></span> Agent is typing…</div>' +
        '<div class="rhc-chat-input">' +
          '<input type="file" id="rhc-img-input" accept="image/*" style="display:none">' +
          '<button class="icon-btn" id="rhc-img-btn" title="Attach image"><i class="fa-solid fa-image"></i></button>' +
          '<textarea id="rhc-input" rows="1" placeholder="Type a message…" oninput="this.style.height=\'40px\';this.style.height=Math.min(120,this.scrollHeight)+\'px\'"></textarea>' +
          '<button class="icon-btn send" id="rhc-send" title="Send"><i class="fa-solid fa-paper-plane"></i></button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(widget);
    chatPanel = widget.querySelector('.rhc-chat-window');
    chatMessages = widget.querySelector('#rhc-messages');
    chatInput = widget.querySelector('#rhc-input');

    widget.querySelector('.rhc-chat-fab').addEventListener('click', function() {
      chatOpen = !chatOpen;
      chatPanel.style.display = chatOpen ? 'flex' : 'none';
      if (chatOpen) {
        var b = widget.querySelector('#rhc-unread');
        b.classList.add('hidden'); b.textContent = '0';
        chatInput.focus();
        setTimeout(function() { chatMessages.scrollTop = chatMessages.scrollHeight; }, 50);
      }
    });
    widget.querySelector('.close').addEventListener('click', function() { chatOpen = false; chatPanel.style.display = 'none'; });
    widget.querySelector('#rhc-send').addEventListener('click', sendVisitorMessage);
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendVisitorMessage(); }
    });
    chatInput.addEventListener('input', function() {
      if (!RHC.currentChatId || !RHC.db) return;
      RHC.db.collection('chats').doc(RHC.currentChatId).set({
        visitorTyping: true,
        visitorTypingAt: RHC.fb.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(function(){});
    });
    var imgBtn = widget.querySelector('#rhc-img-btn');
    var imgInput = widget.querySelector('#rhc-img-input');
    imgBtn.addEventListener('click', function() { imgInput.click(); });
    imgInput.addEventListener('change', async function() {
      var f = imgInput.files && imgInput.files[0];
      if (!f) return;
      imgInput.value = '';
      if (!RHC.db) { alert('Chat is not connected yet. Try again.'); return; }
      var orig = imgBtn.innerHTML;
      imgBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      try {
        var comp = await compressImage(f, 1024);
        var url = await uploadImage(comp);
        await sendVisitorMessage('', url);
      } catch (e) {
        alert('Image upload failed: ' + e.message);
      } finally {
        imgBtn.innerHTML = orig;
      }
    });

    if (RHC.currentChatId) {
      listenToChat(RHC.currentChatId);
    } else {
      showNamePrompt();
    }
  }

  function showNamePrompt() {
    if (!chatMessages) return;
    chatMessages.innerHTML = '<div class="rhc-name-prompt">' +
      '<h3>Welcome to Rental Home Connect 👋</h3>' +
      '<p>Tell us your name and we\'ll connect you with one of our agents. We typically reply in under 2 minutes.</p>' +
      '<input id="rhc-name-input" placeholder="Your name" value="' + escapeHtml(RHC.visitorName || '') + '">' +
      '<button id="rhc-start-btn">Start chat</button></div>';
    var btn = chatMessages.querySelector('#rhc-start-btn');
    var input = chatMessages.querySelector('#rhc-name-input');
    btn.addEventListener('click', startNewChat);
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') startNewChat(); });
    input.focus();
  }

  async function startNewChat() {
    var nameInput = widget.querySelector('#rhc-name-input');
    var name = (nameInput ? nameInput.value.trim() : '') || 'Visitor';
    RHC.visitorName = name;
    localStorage.setItem('rhc_visitor_name', name);
    if (!RHC.db) { alert('Chat is still connecting. Try again in a moment.'); return; }
    chatMessages.innerHTML = '<div style="text-align:center;color:#64748B;font-size:13px;padding:20px">Connecting…</div>';
    try {
      var uid = RHC.auth.currentUser ? RHC.auth.currentUser.uid : 'anon-' + Math.random().toString(36).slice(2);
      var chatRef = await RHC.db.collection('chats').add({
        visitorName: name, visitorUid: uid, visitorEmail: '',
        status: 'waiting', lastMessage: '', lastSenderType: 'customer',
        createdAt: RHC.fb.firestore.FieldValue.serverTimestamp(),
        updatedAt: RHC.fb.firestore.FieldValue.serverTimestamp()
      });
      RHC.currentChatId = chatRef.id;
      localStorage.setItem('rhc_chat_id', RHC.currentChatId);
      await chatRef.collection('messages').add({
        text: "Hi " + name + "! 👋 Thanks for reaching out to Rental Home Connect. How can I help you find your next home today?",
        senderType: 'admin', senderEmail: 'bot',
        timestamp: RHC.fb.firestore.FieldValue.serverTimestamp()
      });
      await chatRef.set({
        lastMessage: "Hi " + name + "! 👋 How can I help you find your next home today?",
        lastSenderType: 'admin', status: 'active',
        updatedAt: RHC.fb.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      listenToChat(RHC.currentChatId);
    } catch (e) {
      console.error('startNewChat', e);
      chatMessages.innerHTML = '<div style="text-align:center;color:#EF4444;font-size:13px;padding:20px">Could not start chat. ' + (e.message || '') + '</div>';
    }
  }

  function listenToChat(chatId) {
    if (RHC.unsubMsgs) { try { RHC.unsubMsgs(); } catch(e){} }
    if (RHC.unsubMeta) { try { RHC.unsubMeta(); } catch(e){} }
    if (chatMessages) chatMessages.innerHTML = '';
    RHC.unsubMsgs = RHC.db.collection('chats').doc(chatId).collection('messages')
      .orderBy('timestamp', 'asc')
      .onSnapshot(function(snap) {
        if (chatMessages) chatMessages.innerHTML = '';
        snap.forEach(function(d) { appendMessage(d.data()); });
        setTimeout(function() { if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight; }, 50);
      });
    RHC.unsubMeta = RHC.db.collection('chats').doc(chatId).onSnapshot(function(d) {
      var data = d.data() || {};
      var isTyping = data.adminTyping && (Date.now() - (data.adminTypingAt && data.adminTypingAt.toMillis ? data.adminTypingAt.toMillis() : 0) < 5000);
      var ind = widget && widget.querySelector('#rhc-typing');
      if (ind) ind.classList.toggle('show', !!isTyping);
      if (!chatOpen && data.lastSenderType === 'admin') {
        var b = widget.querySelector('#rhc-unread');
        if (b) { var n = parseInt(b.textContent || '0') + 1; b.textContent = n; b.classList.remove('hidden'); }
      }
    });
  }

  function appendMessage(m) {
    if (!chatMessages) return;
    var div = document.createElement('div');
    var isVisitor = m.senderType !== 'admin';
    div.className = 'rhc-msg ' + (isVisitor ? 'visitor' : 'agent');
    var html = '';
    if (m.text) html += escapeHtml(m.text);
    if (m.attachmentUrl) {
      var full = m.attachmentUrl;
      if (full.indexOf('res.cloudinary.com/dfd1bgdam') >= 0) {
        full = full.replace('/upload/', '/upload/q_auto,f_auto/');
      }
      html += '<br><img src="' + escapeHtml(full) + '" onclick="window.open(\'' + escapeHtml(full) + '\',\'_blank\')" style="cursor:zoom-in">';
    }
    var ts = m.timestamp ? new Date(m.timestamp.toMillis ? m.timestamp.toMillis() : Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    html += '<div class="ts">' + ts + '</div>';
    div.innerHTML = html;
    chatMessages.appendChild(div);
  }

  async function sendVisitorMessage(text, attachmentUrl) {
    if (!text && !attachmentUrl) {
      text = chatInput.value.trim();
      chatInput.value = '';
      chatInput.style.height = '40px';
      if (!text) return;
    }
    if (!RHC.currentChatId || !RHC.db) {
      await startNewChat();
      if (!RHC.currentChatId) return;
    }
    try {
      var chatRef = RHC.db.collection('chats').doc(RHC.currentChatId);
      await chatRef.collection('messages').add({
        text: text || '', attachmentUrl: attachmentUrl || '',
        senderType: 'customer', senderName: RHC.visitorName || 'Visitor',
        timestamp: RHC.fb.firestore.FieldValue.serverTimestamp()
      });
      await chatRef.set({
        lastMessage: text || (attachmentUrl ? '[image]' : ''),
        lastSenderType: 'customer',
        updatedAt: RHC.fb.firestore.FieldValue.serverTimestamp(),
        visitorTyping: false, status: 'waiting'
      }, { merge: true });
    } catch (e) {
      console.error('sendVisitorMessage', e);
      var div = document.createElement('div');
      div.className = 'rhc-msg agent';
      div.style.background = '#FEE2E2';
      div.style.color = '#EF4444';
      div.textContent = 'Could not send message. ' + (e.message || '');
      chatMessages.appendChild(div);
    }
  }

  // ============ Bootstrap ============
  function start() {
    showChatWidget();
    injectLogo();
    injectFooterContact();

    initFirebase().then(function() {
      if (RHC.currentChatId) listenToChat(RHC.currentChatId);
      // Listen to Firestore cities + listings
      if (RHC.db) {
        RHC.db.collection('cities').onSnapshot(function(snap) {
          rhcCities = [];
          snap.forEach(function(d) { rhcCities.push({ id: d.id, ...d.data() }); });
          if (injectCarouselHost()) renderCarousels();
        });
        RHC.db.collection('listings').onSnapshot(function(snap) {
          rhcListings = [];
          snap.forEach(function(d) { rhcListings.push({ id: d.id, ...d.data() }); });
          renderCarousels();
        });
      }
      updateFooterContact();
    });

    // Start MutationObserver for logo re-injection (React re-renders)
    logoObserver.observe(document.body, { childList: true, subtree: true });

    // Retry carousel injection periodically (in case React mounts the listings div late)
    var tries = 0;
    var interval = setInterval(function() {
      tries++;
      if (tries > 20) { clearInterval(interval); return; }
      if (!carouselHost || !document.body.contains(carouselHost)) {
        if (injectCarouselHost()) renderCarousels();
      }
      injectLogo();
      injectFooterContact();
    }, 800);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
