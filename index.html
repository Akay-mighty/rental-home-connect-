  }
  function prefillChat(msg) {
    if (!chatInput) return;
    chatInput.value = msg;
    chatInput.style.height = '40px';
    chatInput.style.height = Math.min(120, chatInput.scrollHeight) + 'px';
    chatInput.focus();
  }
  RHC.openChatWithMessage = function(msg) {
    if (!chatOpen) openChatWidget();
    setTimeout(function() { prefillChat(msg); }, 350);
  };
  RHC.openChat = openChatWidget;
  RHC.scrollToId = scrollToId;
  RHC.scrollToFooter = scrollToFooter;

  function showChatWidget() {
    if (widget) {
      // BUG 2: Restore chat open state on page load
      if (localStorage.getItem('rhc_chat_open') === '1' && RHC.currentChatId) {
        chatOpen = true;
        widget.win.style.display = 'flex';
      }
      return;
    }
    injectBaseStyles();
    var wrap = document.createElement('div');
    wrap.className = 'rhc-chat-fab-wrap';
    var label = document.createElement('div');
    label.className = 'rhc-chat-fab-label';
    label.textContent = 'Chat with us';
    label.addEventListener('click', function() { toggleChat(); });
    var fab = document.createElement('button');
    fab.className = 'rhc-chat-fab';
    fab.setAttribute('aria-label', 'Open chat');
    fab.innerHTML = SVG.chat + '<span class="badge hidden" id="rhc-unread">0</span>';
    fab.addEventListener('click', function() { toggleChat(); });
    wrap.appendChild(label);
    wrap.appendChild(fab);
    document.body.appendChild(wrap);

    var win = document.createElement('div');
    win.className = 'rhc-chat-window';
    win.style.display = 'none';
    win.innerHTML = '<div class="rhc-chat-header">' +
      '<div class="avatar">' + imgTag(RHC_LOGO_PUBLIC, 'RHC', '') + '</div>' +
      '<div><div class="title">Rental Home Connect</div><div class="sub"><span class="online-dot"></span> Online now</div></div>' +
      '<button class="close" aria-label="Close">' + SVG.close + '</button></div>' +
      '<div class="rhc-chat-messages" id="rhc-messages"></div>' +
      '<div class="rhc-typing" id="rhc-typing"><span class="dots"><span></span><span></span><span></span></span> Agent is typing...</div>' +
      '<div class="rhc-chat-input">' +
        '<input type="file" id="rhc-img-input" accept="image/*" style="display:none">' +
        '<button class="icon-btn" id="rhc-img-btn" title="Attach image" aria-label="Attach image">' + SVG.image + '</button>' +
        '<textarea id="rhc-input" rows="1" placeholder="Type a message..." oninput="this.style.height=\'40px\';this.style.height=Math.min(120,this.scrollHeight)+\'px\'"></textarea>' +
        '<button class="icon-btn send" id="rhc-send" title="Send" aria-label="Send message">' + SVG.send + '</button>' +
      '</div>';
    document.body.appendChild(win);
    widget = { fab: fab, label: label, win: win };
    chatPanel = win;
    chatMessages = win.querySelector('#rhc-messages');
    chatInput = win.querySelector('#rhc-input');

    function toggleChat() {
      chatOpen = !chatOpen;
      win.style.display = chatOpen ? 'flex' : 'none';
      if (chatOpen) {
        var b = win.querySelector('#rhc-unread');
        if (b) { b.classList.add('hidden'); b.textContent = '0'; }
        if (label) label.style.display = 'none';
        setTimeout(function() { chatInput.focus(); chatMessages.scrollTop = chatMessages.scrollHeight; }, 60);
      }
    }
    win.querySelector('.close').addEventListener('click', function() { chatOpen = false; win.style.display = 'none'; localStorage.setItem('rhc_chat_open', '0'); });
    win.querySelector('#rhc-send').addEventListener('click', function(e) { e.preventDefault(); sendVisitorMessage(); });
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendVisitorMessage(); }
    });
    chatInput.addEventListener('input', function() {
      if (!RHC.currentChatId || !RHC.db) return;
      try {
        RHC.db.collection('chats').doc(RHC.currentChatId).set({
          visitorTyping: true,
          visitorTypingAt: RHC.fb.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(function(e){ console.warn('RHC: typing save failed', e); });
      } catch(e) { console.warn('RHC: typing signal failed', e); }
    });
    var imgBtn = win.querySelector('#rhc-img-btn');
    var imgInput = win.querySelector('#rhc-img-input');
    imgBtn.addEventListener('click', function() { imgInput.click(); });
    imgInput.addEventListener('change', async function() {
      var f = imgInput.files && imgInput.files[0];
      if (!f) return;
      imgInput.value = '';
      if (!RHC.db) { toast('Chat is still connecting. Try again in a moment.'); return; }
      var orig = imgBtn.innerHTML;
      imgBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" style="animation:rhcSpin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-dasharray="40 20"/></svg>';
      try {
        var comp = await compressImage(f, 1024);
        var url = await uploadImage(comp);
        await sendVisitorMessage('', url);
      } catch (e) {
        console.error('RHC: image upload failed', e);
        toast('Image could not be sent right now. Please try again.');
      } finally { imgBtn.innerHTML = orig; }
    });

    if (RHC.currentChatId) listenToChat(RHC.currentChatId);
    else showNamePrompt();
  }

  function showNamePrompt() {
    if (!chatMessages) return;
    chatMessages.innerHTML = '<div class="rhc-name-prompt">' +
      '<h3>Welcome to Rental Home Connect</h3>' +
      '<p>Tell us your name and we\'ll connect you with one of our agents. We typically reply in under 2 minutes.</p>' +
      '<input id="rhc-name-input" placeholder="Your name" value="' + escapeHtml(RHC.visitorName || '') + '">' +
      '<button id="rhc-start-btn">Start chat</button></div>';
    var btn = chatMessages.querySelector('#rhc-start-btn');
    var input = chatMessages.querySelector('#rhc-name-input');
    btn.addEventListener('click', function(e) { if (e) e.preventDefault(); startNewChat(); });
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') startNewChat(); });
    setTimeout(function() { input.focus(); }, 50);
  }

  async function startNewChat() {
    var nameInput = widget && widget.win ? widget.win.querySelector('#rhc-name-input') : null;
    var name = (nameInput ? nameInput.value.trim() : '') || 'Visitor';
    RHC.visitorName = name;
    localStorage.setItem('rhc_visitor_name', name);
    if (!RHC.db) { toast('Chat is still connecting. Try again in a moment.'); return; }
    chatMessages.innerHTML = '<div style="text-align:center;color:#64748B;font-size:13px;padding:20px">Connecting...</div>';
    try {
      var uid = RHC.auth && RHC.auth.currentUser ? RHC.auth.currentUser.uid : 'anon-' + Math.random().toString(36).slice(2);
      var chatRef = await RHC.db.collection('chats').add({
        visitorName: name, visitorUid: uid, visitorEmail: RHC.renter ? RHC.renter.email : '',
        status: 'waiting', lastMessage: '', lastSenderType: 'customer',
        createdAt: RHC.fb.firestore.FieldValue.serverTimestamp(),
        updatedAt: RHC.fb.firestore.FieldValue.serverTimestamp()
      });
      RHC.currentChatId = chatRef.id;
      localStorage.setItem('rhc_chat_id', RHC.currentChatId);
      await chatRef.collection('messages').add({
        text: "Hi " + name + "! Thanks for reaching out to Rental Home Connect. How can I help you find your next home today?",
        senderType: 'admin', senderEmail: 'bot',
        timestamp: RHC.fb.firestore.FieldValue.serverTimestamp()
      });
      await chatRef.set({
        lastMessage: "Hi " + name + "! How can I help you find your next home today?",
        lastSenderType: 'admin', status: 'active',
        updatedAt: RHC.fb.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      listenToChat(RHC.currentChatId);
    } catch (e) {
      console.error('RHC: startNewChat failed', e);
      chatMessages.innerHTML = '<div class="rhc-msg error">Could not start chat right now. Please try again in a moment.</div>';
    }
  }

  function listenToChat(chatId) {
    if (!RHC.db) return;
    if (RHC.unsubMsgs) { try { RHC.unsubMsgs(); } catch(e){} }
    if (RHC.unsubMeta) { try { RHC.unsubMeta(); } catch(e){} }
    if (chatMessages) chatMessages.innerHTML = '';
    try {
      RHC.unsubMsgs = RHC.db.collection('chats').doc(chatId).collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(function(snap) {
          if (chatMessages) chatMessages.innerHTML = '';
          snap.forEach(function(d) { appendMessage(d.data()); });
          setTimeout(function() { if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight; }, 50);
        }, function(err) {
          console.error('RHC: messages snapshot failed', err);
          if (chatMessages) chatMessages.innerHTML = '<div class="rhc-msg error">Connection lost. Please refresh the page.</div>';
        });
      RHC.unsubMeta = RHC.db.collection('chats').doc(chatId).onSnapshot(function(d) {
        var data = d.data() || {};
        var adminTypingAt = data.adminTypingAt && data.adminTypingAt.toMillis ? data.adminTypingAt.toMillis() : 0;
        var isTyping = data.adminTyping && (Date.now() - adminTypingAt < 5000);
        var ind = widget && widget.win ? widget.win.querySelector('#rhc-typing') : null;
        if (ind) ind.classList.toggle('show', !!isTyping);
        if (!chatOpen && data.lastSenderType === 'admin') {
          var b = widget && widget.win ? widget.win.querySelector('#rhc-unread') : null;
          if (b) { var n = parseInt(b.textContent || '0', 10) + 1; b.textContent = n; b.classList.remove('hidden'); }
        }
      }, function(err) { console.warn('RHC: meta snapshot failed', err); });
    } catch(e) { console.error('RHC: listenToChat setup failed', e); }
  }

  function appendMessage(m) {
    if (!chatMessages) return;
    var div = document.createElement('div');
    var isVisitor = m.senderType !== 'admin';
    div.className = 'rhc-msg ' + (isVisitor ? 'visitor' : 'agent');
    var html = '';
    if (m.text) html += escapeHtml(m.text);
    if (m.attachmentUrl) {
      var full = m.attachmentUrl;
      if (full.indexOf('res.cloudinary.com/' + RHC.cloudName) >= 0) {
        full = full.replace('/upload/', '/upload/q_auto,f_auto/');
      }
      // Build a clickable thumbnail that opens the full image in a new tab
      html += '<br><a href="' + escapeHtml(full) + '" target="_blank" rel="noopener" style="display:block">' +
              '<img src="' + escapeHtml(full) + '" onclick="RHC.openChatLightbox(\'' + escapeHtml(full) + '\')" style="max-width:100%;width:auto;max-height:220px;border-radius:10px;margin-top:6px;cursor:pointer;display:block;object-fit:contain;box-sizing:border-box">' +
              '</a>';
    }
    var ts = m.timestamp ? new Date(m.timestamp.toMillis ? m.timestamp.toMillis() : Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    html += '<div class="ts">' + ts + '</div>';
    div.innerHTML = html;
    chatMessages.appendChild(div);
  }

  async function sendVisitorMessage(text, attachmentUrl) {
    if (typeof text !== 'string') text = '';
    if (!text && !attachmentUrl) {
      if (!chatInput) return;
      text = chatInput.value.trim();
      chatInput.value = '';
      chatInput.style.height = '40px';
      if (!text) return;
    }
    if (!RHC.currentChatId || !RHC.db) {
      await startNewChat();
      if (!RHC.currentChatId) return;
    }
    var messageSent = false;
    try {
      var chatRef = RHC.db.collection('chats').doc(RHC.currentChatId);
      await chatRef.collection('messages').add({
        text: text || '', attachmentUrl: attachmentUrl || '',
        senderType: 'customer', senderName: RHC.visitorName || 'Visitor',
        timestamp: RHC.fb.firestore.FieldValue.serverTimestamp()
      });
      messageSent = true;
    } catch (e) {
      console.error('RHC: message.add failed', e);
      var div = document.createElement('div');
      div.className = 'rhc-msg error';
      div.textContent = 'Message could not be sent. Please try again.';
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return;
    }
    try {
      var chatRef2 = RHC.db.collection('chats').doc(RHC.currentChatId);
      await chatRef2.set({
        lastMessage: text || (attachmentUrl ? '[image]' : ''),
        lastSenderType: 'customer',
        updatedAt: RHC.fb.firestore.FieldValue.serverTimestamp(),
        visitorTyping: false, status: 'waiting'
      }, { merge: true });
    } catch (e) {
      console.warn('RHC: chat metadata update failed (message was still sent)', e);
    }
  }

  // BUG 1: In-app lightbox for chat images — no navigating away
  RHC.openChatLightbox = function(imgUrl) {
    // Remove existing lightbox
    var existing = document.getElementById('rhc-chat-lightbox');
    if (existing) existing.remove();
    var lb = document.createElement('div');
    lb.id = 'rhc-chat-lightbox';
    lb.className = 'rhc-chat-lightbox';
    lb.innerHTML = '<img src="' + escapeHtml(imgUrl) + '" onclick="event.stopPropagation()">';
    // Close on click outside the image, or Escape key
    lb.addEventListener('click', function() { lb.remove(); });
    document.addEventListener('keydown', function escHandler(e) {
      if (e.key === 'Escape') { lb.remove(); document.removeEventListener('keydown', escHandler); }
    });
    document.body.appendChild(lb);
  };

  // ============ Cloudinary upload (with Firebase Storage fallback) ============
  async function uploadImage(file) {
    try {
      var fd = new FormData();
      fd.append('file', file, file.name || ('visitor-' + Date.now() + '.jpg'));
      fd.append('upload_preset', RHC.uploadPreset);
      fd.append('folder', 'rhc-chat');
      console.log('[Cloudinary] Uploading to cloud:', RHC.cloudName, '| preset:', RHC.uploadPreset);
      var res = await fetch('https://api.cloudinary.com/v1_1/' + RHC.cloudName + '/image/upload', { method: 'POST', body: fd });
      if (!res.ok) {
        var errTxt = '';
        try { errTxt = await res.text(); } catch(e) {}
        throw new Error('Cloudinary HTTP ' + res.status + ' ' + errTxt.slice(0, 200));
      }
      var data = await res.json();
      if (!data.secure_url) throw new Error('Cloudinary: no secure_url in response');
      return data.secure_url;
    } catch (cloudErr) {
      console.warn('RHC: Cloudinary upload failed, trying Firebase Storage fallback:', cloudErr);
      if (RHC.storage) {
        try {
          var path = 'rhc-chat/' + Date.now() + '-' + (file.name || 'upload.jpg').replace(/[^a-zA-Z0-9.-]/g, '_');
          var ref = RHC.storage.ref(path);
          await ref.put(file);
          var url = await ref.getDownloadURL();
          return url;
        } catch (fbErr) {
          console.error('RHC: Firebase Storage upload also failed:', fbErr);
          throw new Error('Both Cloudinary and Firebase Storage failed. Please try again later.');
        }
      }
      throw cloudErr;
    }
  }

  function compressImage(file, maxDim) {
    return new Promise(function(resolve, reject) {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function(b) { b ? resolve(b) : reject(new Error('compress fail')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function() { reject(new Error('img load fail')); };
      img.src = URL.createObjectURL(file);
    });
  }

  // ============ Footer contact block ============
  function updateFooterContact() {
    var host = document.getElementById('rhc-footer-contact');
    if (!host) return;
    var b = RHC.branding || {};
    var html = '<div class="rhc-footer-contact-row">';
    html += imgTag(RHC_LOGO_ADMIN, 'Rental Home Connect', 'height:80px;width:auto;object-fit:contain');
    html += '<div class="rhc-footer-contact-info">';
    if (b.email) html += '<div class="row">' + SVG.mail + ' <a href="mailto:' + escapeHtml(b.email) + '">' + escapeHtml(b.email) + '</a></div>';
    if (b.phone) html += '<div class="row">' + SVG.phone + ' ' + escapeHtml(b.phone) + '</div>';
    if (b.tiktok) {
      var ttUrl = b.tiktokUrl || ('https://www.tiktok.com/@' + b.tiktok);
      html += '<div class="row">' + SVG.tiktok + ' <a href="' + escapeHtml(ttUrl) + '" target="_blank" rel="noopener">@' + escapeHtml(b.tiktok) + '</a></div>';
    }
    var agents = b.tiktokAgents || [];
    if (agents.length) {
      var agentUrls = b.tiktokAgentUrls || {};
      html += '<div class="row" style="flex-wrap:wrap">' + SVG.user + ' <span>Agents:</span> ';
      agents.forEach(function(a, i) {
        var url = agentUrls[a] || ('https://www.tiktok.com/@' + a);
        html += '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">@' + escapeHtml(a) + '</a>';
        if (i < agents.length - 1) html += '<span style="color:#94A3B8">, </span>';
      });
      html += '</div>';
    }
    html += '</div></div>';
    host.innerHTML = html;
  }

  function injectFooterContact() {
    if (document.getElementById('rhc-footer-contact-host')) { updateFooterContact(); return true; }
    // Contact us MUST go AFTER testimonials. If testimonials don't exist yet, wait.
    var testimonials = document.getElementById('rhc-testimonials');
    if (!testimonials) return false; // Try again on next tick
    // Insert AFTER testimonials (before whatever comes next)
    var insertBefore = testimonials.nextElementSibling;
    // Skip other RHC sections to find the right spot
    while (insertBefore && (insertBefore.id === 'rhc-reco-block' || insertBefore.id === 'rhc-mobile-tabbar' || insertBefore.id === 'rhc-footer-contact-host')) {
      insertBefore = insertBefore.nextElementSibling;
    }
    // If nothing after testimonials, append to parent
    var parent = testimonials.parentElement;
    if (!insertBefore) insertBefore = null; // appendChild instead
    var block = document.createElement('div');
    block.id = 'rhc-footer-contact-host';
    block.className = 'rhc-footer-contact-host';
    block.innerHTML = '<h3>Contact us</h3><div id="rhc-footer-contact"></div>';
    if (insertBefore) {
      parent.insertBefore(block, insertBefore);
    } else {
      parent.appendChild(block);
    }
    updateFooterContact();
    // Inject copyright footer at the very bottom (after contact-us)
    if (!document.getElementById('rhc-copyright-footer')) {
      var cf = document.createElement('div');
      cf.id = 'rhc-copyright-footer';
      cf.className = 'rhc-copyright-footer';
      cf.innerHTML = '&copy; 2017-' + new Date().getFullYear() + ' Rental Home Connect. All rights reserved.<br><span class="badge">Equal Housing Opportunity</span>';
      block.parentElement.appendChild(cf);
    }
    return true;
  }

  // ============ Bootstrap ============
  function start() {
    injectBaseStyles();
    // Build chat widget early so visitors see the FAB immediately
    showChatWidget();
    // Inject static sections — ORDER MATTERS:
    // 1. Testimonials FIRST (so contact-us can find them)
    // 2. Footer contact SECOND (inserts AFTER testimonials)
    injectAccountButton();
    injectRecommendationsBlock();
    injectMobileTabBar();
    injectTestimonials();
    injectFooterContact();
    // FIX E13: wire up Terms/Privacy links on every page load
    setupTermsAndPrivacyLinks();
    // FIX D7: wire up nav links
    setupNavLinks();
    // FIX D8: hide React bundle's filter pills
    hideReactFilterPills();
    // MutationObserver for heart icons on cards (cards only)
    setupHeartObserver();

    // Initialize Firebase (async, sets up Firestore listeners)
    initFirebase();

    // Periodic retry for sections that depend on the React tree being mounted.
    var tries = 0;
    var interval = setInterval(function() {
      tries++;
      if (tries > 90) { clearInterval(interval); return; }
      injectAccountButton();
      setupApplicationButton();
      setupSearchHandler();
      setupTermsAndPrivacyLinks();
      setupNavLinks();
      hideReactFilterPills();
      if (injectTestimonials()) { /* keep going so positioning can adjust if layout shifts */ }
      injectRecommendationsBlock();
      injectFooterContact();
      // Inject content hosts in correct order: carousels -> other houses -> map
      if (injectContentHosts()) {
        // Inject the filter bar right above the other houses host
        injectFilterBar();
        // Render skeletons immediately if data not yet loaded
        if (!RHC.dataLoaded && rhcListings.length === 0) {
          renderCarouselsSkeleton();
          renderOtherHousesSkeleton();
        } else {
          renderCarousels();
          renderOtherHouses();
        }
        initMap();
      }
    }, 800);
  }

  // BUG 2 FIX: Handle URL hash on load + on hashchange
  function handleHashRoute() {
    var hash = window.location.hash;
    if (!hash || hash === '#') return;
    setTimeout(function() {
      // Property detail page routing: #property/[id]
      if (hash.indexOf('#property/') === 0) {
        var propId = hash.replace('#property/', '');
        if (propId && rhcListings.length > 0) {
          var listing = null;
          for (var i = 0; i < rhcListings.length; i++) {
            if (rhcListings[i].id === propId) { listing = rhcListings[i]; break; }
          }
          if (listing) {
            var fakeCard = { getAttribute: function() { return propId; }, querySelector: function() { return null; }, textContent: '' };
            openDetailPage(fakeCard);
          } else {
            // Listing not in cache — fetch from Firestore
            if (RHC.db) {
              RHC.db.collection('listings').doc(propId).get().then(function(doc) {
                if (doc.exists) {
                  var freshData = Object.assign({ id: doc.id }, doc.data());
                  rhcListings.push(freshData);
                  RHC.currentListing = freshData;
                  var fakeCard2 = { getAttribute: function() { return propId; }, querySelector: function() { return null; }, textContent: '' };
                  openDetailPage(fakeCard2);
                }
              }).catch(function(e) { console.warn('RHC: property route fetch failed', e); });
            }
          }
        }
        return;
      }
      if (hash === '#rent' || hash === '#/') {
        var l = document.getElementById('listings'); if (l) l.scrollIntoView({ behavior: 'smooth' });
      } else if (hash === '#mortgage') {
        if (RHC.showComingSoon) RHC.showComingSoon('Get a mortgage', 'Mortgage services coming soon.');
      } else if (hash === '#find-an-agent') {
        var f = document.getElementById('rhc-footer-contact-host') || document.getElementById('listings');
        if (f) f.scrollIntoView({ behavior: 'smooth' });
      } else if (hash === '#get-help') {
        if (RHC.openChat) RHC.openChat();
      } else if (hash === '#advertise') {
        if (RHC.showComingSoon) RHC.showComingSoon('Advertise', 'Advertising opportunities coming soon.');
      } else if (hash === '#manage') {
        window.open('admin.html', '_blank');
      }
    }, 800); // delay so React has mounted + Firestore loaded
  }
  window.addEventListener('hashchange', handleHashRoute);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { start(); handleHashRoute(); });
  } else {
    start(); handleHashRoute();
  }
})();
</script>
