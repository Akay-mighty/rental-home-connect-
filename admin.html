<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0">
<title>Rental Home Connect — Staff Portal</title>
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Firebase 9.23.0 compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #F5F1EB;
    color: #1A1A18;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4,h5 { font-family: 'Inter', sans-serif; font-weight: 700; }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

  :root {
    --primary: #0A66FF;
    --primary-dark: #0852CC;
    --dark: #1A1A18;
    --light: #FFFCF8;
    --gray: #64748B;
    --border: #E8E2D9;
    --accent: #F5F1EB;
    --error: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
  }

  /* ============================ TOAST ============================ */
  #toast-container {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10000; display: flex; flex-direction: column; gap: 8px;
    width: calc(100% - 32px); max-width: 420px; pointer-events: none;
  }
  .toast {
    background: #1A1A18; color: #fff; padding: 12px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    display: flex; align-items: center; gap: 10px; pointer-events: auto;
    animation: toastIn .25s ease;
  }
  .toast.error { background: var(--error); }
  .toast.success { background: var(--success); }
  .toast.warning { background: var(--warning); color: #1A1A18; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

  /* ============================ LOGIN ============================ */
  .login-wrap {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0A66FF 0%, #1A1A18 100%);
    padding: 20px;
  }
  .login-card {
    background: #FFFCF8; border-radius: 24px; padding: 40px 32px;
    width: 100%; max-width: 420px; box-shadow: 0 24px 60px rgba(0,0,0,.3);
    text-align: center;
  }
  .login-logo {
    width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #0A66FF, #1A1A18);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 32px; box-shadow: 0 12px 28px rgba(10,102,255,.35);
    overflow: hidden;
  }
  .login-logo img { width: 100%; height: 100%; object-fit: contain; }
  .login-card h1 { font-size: 24px; color: var(--dark); margin-bottom: 4px; }
  .login-card .sub { color: var(--gray); font-size: 14px; margin-bottom: 28px; }
  .login-card .field {
    text-align: left; margin-bottom: 16px;
  }
  .login-card label {
    display: block; font-size: 13px; font-weight: 600; color: var(--dark);
    margin-bottom: 6px;
  }
  .login-card input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid var(--border); background: #fff; font-size: 14px;
    transition: border .2s, box-shadow .2s;
  }
  .login-card input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(10,102,255,.12);
  }
  .login-card button {
    width: 100%; padding: 14px; border-radius: 12px;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 15px;
    box-shadow: 0 8px 20px rgba(10,102,255,.35);
    transition: transform .15s, background .2s; margin-top: 8px;
  }
  .login-card button:hover { transform: translateY(-1px); background: var(--primary-dark); }
  .login-card button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .login-card .back-link {
    display: inline-block; margin-top: 20px; color: var(--gray);
    font-size: 13px; text-decoration: underline;
  }
  .login-card .back-link:hover { color: var(--primary); }

  /* ============================ ADMIN LAYOUT ============================ */
  .admin-layout {
    display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; min-height: 100dvh;
  }
  .admin-sidebar {
    background: var(--dark); color: #CBD5E1; padding: 20px 0;
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .admin-brand {
    display: flex; align-items: center; gap: 10px; padding: 0 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 16px;
  }
  .admin-brand .brand-shield {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #0A66FF, #1A1A18);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px;
    overflow: hidden; flex-shrink: 0;
  }
  .admin-brand .brand-shield img { width: 100%; height: 100%; object-fit: contain; }
  .admin-brand .brand-name {
    font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 18px;
    color: #fff; line-height: 1.1;
  }
  .admin-brand .brand-tag { font-size: 11px; color: #64748B; }

  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; color: #CBD5E1; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all .15s; border-left: 3px solid transparent;
  }
  .nav-item i { width: 18px; font-size: 15px; }
  .nav-item:hover { background: rgba(255,255,255,.04); color: #fff; }
  .nav-item.active {
    background: rgba(10,102,255,.15); color: #fff;
    border-left-color: var(--primary);
  }
  .nav-badge {
    margin-left: auto; background: var(--error); color: #fff;
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
    min-width: 20px; text-align: center;
  }
  .admin-user {
    margin-top: auto; padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 10px;
  }
  .admin-user .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #0A66FF, #1A1A18);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .admin-user .user-info { flex: 1; min-width: 0; }
  .admin-user .user-email { font-size: 12px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .admin-user .user-role { font-size: 10px; color: #64748B; }
  .admin-user .sign-out-btn {
    color: #94A3B8; padding: 6px; border-radius: 6px; transition: all .15s;
  }
  .admin-user .sign-out-btn:hover { background: rgba(239,68,68,.15); color: var(--error); }

  .admin-main {
    padding: 24px 28px; max-width: 100%; overflow-x: hidden;
  }
  .admin-main h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: 28px; color: var(--dark); margin-bottom: 4px;
  }
  .admin-main .page-sub { color: var(--gray); font-size: 14px; margin-bottom: 24px; }

  /* KPI grid */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .kpi-card {
    background: #fff; border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 20px; transition: transform .2s, box-shadow .2s;
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.06); }
  .kpi-card .kpi-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(10,102,255,.08); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 10px;
  }
  .kpi-card .kpi-value {
    font-size: 26px; font-weight: 800; color: var(--dark); line-height: 1; letter-spacing: -.5px;
  }
  .kpi-card .kpi-label { font-size: 12px; color: var(--gray); margin-top: 4px; font-weight: 500; }

  /* Cards / panels */
  .panel {
    background: #fff; border: 1px solid var(--border); border-radius: 16px;
    padding: 22px; margin-bottom: 20px;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
  }
  .panel-header h2 {
    font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; color: var(--dark);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13px;
    transition: all .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-ghost { background: #F5F1EB; color: var(--dark); }
  .btn-ghost:hover { background: var(--border); }
  .btn-danger { background: rgba(239,68,68,.1); color: var(--error); }
  .btn-danger:hover { background: var(--error); color: #fff; }

  /* Chat inbox */
  .chat-layout {
    display: grid; grid-template-columns: 320px 1fr;
    background: #fff; border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; height: calc(100vh - 200px); height: calc(100dvh - 200px); min-height: 480px;
  }
  .chat-list {
    border-right: 1px solid var(--border); overflow-y: auto; background: #FAFAF8;
  }
  .chat-list-header {
    padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: #fff; z-index: 2;
  }
  .chat-search {
    width: 100%; padding: 8px 12px 8px 32px; border-radius: 10px;
    border: 1px solid var(--border); background: #F5F1EB; font-size: 13px;
    position: relative;
  }
  .chat-search-wrap { position: relative; }
  .chat-search-wrap i {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--gray); font-size: 12px;
  }
  .chat-item {
    padding: 14px 16px; border-bottom: 1px solid #F1F5F9; cursor: pointer;
    transition: background .15s; display: flex; gap: 12px; align-items: center;
  }
  .chat-item:hover { background: #FFF; }
  .chat-item.active { background: rgba(10,102,255,.06); border-left: 3px solid var(--primary); }
  .chat-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #0A66FF, #1A1A18);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-weight: 700; font-size: 14px;
  }
  .chat-meta { flex: 1; min-width: 0; }
  .chat-meta .name { font-size: 14px; font-weight: 600; color: var(--dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-meta .preview { font-size: 12px; color: var(--gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .chat-meta .time { font-size: 10px; color: #94A3B8; }
  .chat-item .unread {
    background: var(--error); color: #fff; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 10px; min-width: 18px; text-align: center;
  }
  .chat-item .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.active { background: var(--success); }
  .status-dot.waiting { background: var(--warning); }
  .status-dot.resolved { background: #94A3B8; }

  /* Conversation panel */
  .conv-panel { display: flex; flex-direction: column; overflow: hidden; }
  .conv-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: #fff;
  }
  .conv-header .info { flex: 1; }
  .conv-header .info h3 { font-size: 16px; color: var(--dark); }
  .conv-header .info .sub { font-size: 12px; color: var(--gray); }
  .conv-messages {
    flex: 1; overflow-y: auto; padding: 20px; background: #FAFAF8;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 70%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.45; word-wrap: break-word; position: relative;
  }
  .msg.admin { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.customer { background: #fff; color: var(--dark); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  .msg .ts { font-size: 10px; opacity: .7; margin-top: 4px; }
  .msg img { max-width: 240px; border-radius: 8px; margin-top: 6px; cursor: pointer; }
  .typing-indicator {
    align-self: flex-start; padding: 10px 14px; border-radius: 16px;
    background: #fff; border: 1px solid var(--border); color: var(--gray);
    font-size: 13px; display: none;
  }
  .typing-indicator.show { display: block; }
  .typing-indicator .dots span {
    display: inline-block; width: 6px; height: 6px; background: var(--gray);
    border-radius: 50%; margin: 0 1px; animation: typingDot 1.4s infinite;
  }
  .typing-indicator .dots span:nth-child(2) { animation-delay: .2s; }
  .typing-indicator .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes typingDot { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

  .conv-input {
    padding: 14px 20px; border-top: 1px solid var(--border); background: #fff;
    display: flex; gap: 10px; align-items: flex-end;
  }
  .conv-input textarea {
    flex: 1; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
    font-size: 14px; resize: none; min-height: 42px; max-height: 120px;
    transition: border .2s;
  }
  .conv-input textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(10,102,255,.12); }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 10px; background: #F5F1EB;
    display: flex; align-items: center; justify-content: center; color: var(--dark);
    transition: all .15s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--border); }
  .icon-btn.send { background: var(--primary); color: #fff; }
  .icon-btn.send:hover { background: var(--primary-dark); }
  .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px; text-align: center; color: var(--gray);
  }
  .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: .3; }
  .empty-state h3 { color: var(--dark); margin-bottom: 4px; font-size: 18px; }

  /* Tables */
  /* Mobile-friendly property cards */
  .rhc-mobile-cards { display: flex; flex-direction: column; gap: 12px; }
  .rhc-property-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .15s; }
  .rhc-property-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  .rhc-property-card-top { display: flex; align-items: flex-start; gap: 12px; }
  .rhc-property-card-top .listing-checkbox { margin-top: 4px; flex-shrink: 0; }
  .rhc-property-thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .rhc-property-thumb-placeholder { width: 80px; height: 60px; background: #F5F1EB; border-radius: 8px; flex-shrink: 0; }
  .rhc-property-info { flex: 1; min-width: 0; }
  .rhc-property-address { font-weight: 700; font-size: 14px; color: var(--dark); margin-bottom: 2px; }
  .rhc-property-city { font-size: 12px; color: var(--gray); margin-bottom: 4px; }
  .rhc-property-stats { font-size: 12px; color: var(--dark); }
  .rhc-property-type { font-size: 11px; color: var(--gray); margin-top: 2px; }
  .rhc-property-actions { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid #F1F5F9; }
  .rhc-property-actions .btn { flex: 1; justify-content: center; }
  /* Desktop: show as table-like rows */
  @media (min-width: 769px) {
    .rhc-property-card { flex-direction: row; align-items: center; }
    .rhc-property-card-top { flex: 1; }
    .rhc-property-actions { border-top: none; padding-top: 0; border-left: 1px solid #F1F5F9; padding-left: 12px; }
    .rhc-property-actions .btn { flex: none; }
  }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 768px) { .data-table { min-width: 700px; } }
  .data-table th {
    text-align: left; padding: 12px 14px; background: #F5F1EB; color: var(--gray);
    font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .3px;
    border-bottom: 1px solid var(--border);
  }
  .data-table td { padding: 14px; border-bottom: 1px solid #F1F5F9; color: var(--dark); }
  .data-table tr:hover { background: #FAFAF8; }
  .data-table img.thumb { width: 60px; height: 40px; object-fit: cover; border-radius: 6px; }

  /* Forms */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .form-field { display: flex; flex-direction: column; gap: 6px; }
  .form-field label { font-size: 12px; font-weight: 600; color: var(--dark); }
  .form-field input, .form-field textarea, .form-field select {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 13px; background: #fff; transition: border .2s, box-shadow .2s;
  }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,102,255,.12);
  }
  .form-field textarea { resize: vertical; min-height: 80px; }
  .form-actions { display: flex; gap: 10px; margin-top: 18px; }

  /* Image grid */
  .image-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .image-card {
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: #fff; transition: transform .15s, box-shadow .15s;
  }
  .image-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
  .image-card img { width: 100%; height: 120px; object-fit: cover; }
  .image-card .info { padding: 10px 12px; }
  .image-card .url { font-size: 11px; color: var(--gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .image-card .actions { display: flex; gap: 6px; margin-top: 8px; }
  .image-card .actions button {
    padding: 4px 10px; font-size: 11px; border-radius: 6px; background: #F5F1EB;
  }
  .image-card .actions button.del:hover { background: var(--error); color: #fff; }
  .image-card .actions button.copy:hover { background: var(--primary); color: #fff; }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--border); border-radius: 14px; padding: 28px;
    text-align: center; cursor: pointer; transition: all .2s; margin-bottom: 20px;
    background: #FAFAF8;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--primary); background: rgba(10,102,255,.04);
  }
  .upload-zone i { font-size: 36px; color: var(--primary); margin-bottom: 10px; }
  .upload-zone h4 { font-size: 16px; color: var(--dark); margin-bottom: 4px; }
  .upload-zone p { font-size: 13px; color: var(--gray); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(26,26,24,.55); backdrop-filter: blur(4px);
    z-index: 9000; display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-card {
    background: #fff; border-radius: 20px; padding: 0;
    width: 100%; max-width: 560px; max-height: 90dvh; max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: popIn .25s ease;
    overflow: hidden;
  }
  .modal-card > h3, .modal-card > .modal-sub { padding: 20px 24px 0; flex-shrink: 0; }
  .modal-card > form { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .modal-card > .modal-footer { padding: 16px 24px; flex-shrink: 0; border-top: 1px solid var(--border); background: #FAFAF8; }
  .modal-card > .modal-btns { padding: 16px 24px; flex-shrink: 0; border-top: 1px solid var(--border); background: #FAFAF8; }

    .hamburger { display: none; }

  const fd = new FormData();

  const data = await res.json();
  if (!data || !data.secure_url) throw new Error('Cloudinary: no secure_url in response');

}

/* ----------------------------- Helpers ----------------------------- */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString();
}

function timeShort(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function initials(str) {
  if (!str) return '?';
  return str.split(/[\s@._-]+/).filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join('');
}

/* ----------------------------- Toast ----------------------------- */
function toast(msg, type, opts) {
  opts = opts || {};
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-info';
  t.innerHTML = `<i class="fa-solid ${icon}"></i><span>${escapeHtml(msg)}</span>`;
  if (opts.duration === 0) {
    const x = document.createElement('button');
    x.innerHTML = '<i class="fa-solid fa-xmark"></i>';
    x.style.cssText = 'background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;padding:2px 6px;cursor:pointer;margin-left:auto';
    x.onclick = () => t.remove();
    t.appendChild(x);
  }
  c.appendChild(t);
  const dur = opts.duration != null ? opts.duration : 3500;
  if (dur > 0) setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, dur);
}
window.toast = toast;

        <div class="modal-footer" style="justify-content:center">

  document.getElementById('modal-cancel').onclick = () => root.innerHTML = '';
  document.getElementById('modal-confirm').onclick = async () => {

}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  if (!email || !pass) return;
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const user = cred.user;
    const userDoc = await db.collection('users').doc(user.uid).get();
    let isAdmin = false;
    if (userDoc.exists && userDoc.data().isAdmin === true) {
      isAdmin = true;
    } else if (!userDoc.exists) {
      // Bootstrap: first admin auto-promotes
      if (!getCachedAdmin()) {
        try {
          await db.collection('users').doc(user.uid).set({
            email: user.email,
            isAdmin: true,
            lastLogin: firebase.firestore.FieldValue.serverTimestamp()
          });
          isAdmin = true;
        } catch (e) { console.warn('bootstrap admin create failed', e); }
      }
    }
    if (!isAdmin) {
      await auth.signOut();
      toast('Access denied. This account is not a staff member.', 'error');
      btn.disabled = false; btn.textContent = 'Sign In';
      return;
    }
    State.isAdmin = true;
    State.adminUser = { uid: user.uid, email: user.email, lastLogin: new Date() };
    localStorage.setItem('rhc_admin', JSON.stringify(State.adminUser));
    renderAdmin();
    startAdminWatchers();
  } catch (err) {
    console.error('login err', err);
    if (err && (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')) {
      toast('Incorrect email or password.', 'error');
    } else if (err && err.code === 'auth/too-many-requests') {
      toast('Too many attempts. Try again later.', 'error');
    } else if (err && (err.code === 'auth/network-request-failed' || err.code === 'auth/internal-error')) {
      toast('Network issue. Check your connection.', 'error');
    } else {
      toast('Sign in failed. ' + (err && err.code ? '(' + err.code + ')' : ''), 'error');
    }
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}
window.handleLogin = handleLogin;

function getCachedAdmin() {
  try { return JSON.parse(localStorage.getItem('rhc_admin') || 'null'); } catch (e) { return null; }
}

function signOutAdmin() {

      if (State.unsubListings) { try { State.unsubListings(); } catch(e){} State.unsubListings = null; }
      if (State.unsubCities) { try { State.unsubCities(); } catch(e){} State.unsubCities = null; }
      if (State.unsubLeads) { try { State.unsubLeads(); } catch(e){} State.unsubLeads = null; }
      await auth.signOut();
    } catch (e) { console.warn(e); }
    localStorage.removeItem('rhc_admin');

function renderChatList() {
  const host = document.getElementById('chat-list-items');
  if (!host) return;

  if (State.chatSearch.trim()) {
    const q = State.chatSearch.trim().toLowerCase();
    chats = chats.filter(c => (c.visitorName || c.id || '').toLowerCase().includes(q));
  }
  chats.sort((a, b) => {
    const ta = a.updatedAt ? (a.updatedAt.toMillis ? a.updatedAt.toMillis() : new Date(a.updatedAt).getTime()) : 0;
    const tb = b.updatedAt ? (b.updatedAt.toMillis ? b.updatedAt.toMillis() : new Date(b.updatedAt).getTime()) : 0;
    return tb - ta;
  });

  if (chats.length === 0) {
    host.innerHTML = `<div class="empty-state" style="padding:30px"><i class="fa-regular fa-comments"></i><h3>No chats</h3><p>No conversations match this filter.</p></div>`;

/* Throttled typing notifier — when admin types, set adminTyping=true on chat doc */
let lastTypingPing = 0;
function notifyVisitorTyping() {
  if (!State.selectedChatId || !db) return;
  const now = Date.now();
  if (now - lastTypingPing < 3000) return;
  lastTypingPing = now;
  db.collection('chats').doc(State.selectedChatId).set({
    adminTyping: true,
    adminTypingAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(() => {});
}
window.notifyVisitorTyping = notifyVisitorTyping;

let currentMessages = [];
let msgUnsub = null;
let typingUnsub = null;

function attachMessageWatcher(chatId) {
  if (msgUnsub) { try { msgUnsub(); } catch(e){} }
  if (typingUnsub) { try { typingUnsub(); } catch(e){} }
  currentMessages = [];
  const msgsHost = document.getElementById('conv-messages');
  if (msgsHost) msgsHost.innerHTML = '<div style="text-align:center;color:var(--gray);font-size:13px;padding:20px">Loading messages…</div>';

  msgUnsub = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('timestamp', 'asc')
    .onSnapshot(snap => {
      currentMessages = [];
      snap.forEach(d => currentMessages.push({ id: d.id, ...d.data() }));
      renderMessages();
      scrollConvToBottom();
    }, err => {
      console.warn('msgWatch err', err);
      if (msgsHost) msgsHost.innerHTML = '<div style="text-align:center;color:var(--gray);font-size:13px;padding:20px">Could not load messages. Check Firestore rules.</div>';
    });

  // Typing indicator
  typingUnsub = db.collection('chats').doc(chatId).onSnapshot(d => {
    const data = d.data() || {};
    const ind = document.getElementById('typing-indicator');
    if (ind) {
      const isTyping = data.visitorTyping && (Date.now() - (data.visitorTypingAt?.toMillis?.() || 0) < 5000);
      ind.classList.toggle('show', !!isTyping);
    }
  });
}

function renderMessages() {
  const host = document.getElementById('conv-messages');
  if (!host) return;
  if (currentMessages.length === 0) {
    host.innerHTML = '<div style="text-align:center;color:var(--gray);font-size:13px;padding:20px">No messages yet. Say hello!</div>';
    return;
  }
  host.innerHTML = currentMessages.map(m => {
    const isAdmin = m.senderType === 'admin';
    const ts = m.timestamp ? timeShort(m.timestamp) : '';
    let body = escapeHtml(m.text || '');
    if (m.attachmentUrl) {
      const full = cloudinaryThumb(m.attachmentUrl, { q: 'auto', f: 'auto' }) || m.attachmentUrl;
      body += `<br><img src="${escapeHtml(full)}" onclick="window.open('${escapeHtml(full)}','_blank')" style="cursor:zoom-in">`;
    }
    return `<div class="msg ${isAdmin ? 'admin' : 'customer'}">${body}<div class="ts">${ts}</div></div>`;
  }).join('');
}

function scrollConvToBottom() {
  const host = document.getElementById('conv-messages');
  if (host) host.scrollTop = host.scrollHeight;
}

async function sendAdminMessage() {
  const ta = document.getElementById('conv-text');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text || !State.selectedChatId) return;
  ta.value = '';
  autoGrow(ta);
  try {
    const chatRef = db.collection('chats').doc(State.selectedChatId);
    await chatRef.collection('messages').add({
      text,
      senderType: 'admin',
      senderEmail: State.adminUser?.email || 'admin',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    await chatRef.set({
      lastMessage: text,
      lastSenderType: 'admin',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: 'active'
    }, { merge: true });
  } catch (err) {
    console.error('sendAdminMessage', err);
    toast('Could not send message. ' + (err.code || ''), 'error');
  }
}
window.sendAdminMessage = sendAdminMessage;

async function handleConvImage(input) {
  const file = input.files && input.files[0];
  if (!file || !State.selectedChatId) return;
  input.value = '';
  toast('Uploading image…', 'info', { duration: 0, id: 'img-upload' });
  try {
    // Compress to 1024px max
    const compressed = await compressImage(file, 1024);
    const url = await uploadToCloudinary(compressed, file.name || `chat-${Date.now()}.jpg`);
    const chatRef = db.collection('chats').doc(State.selectedChatId);
    await chatRef.collection('messages').add({
      text: '',
      attachmentUrl: url,
      senderType: 'admin',
      senderEmail: State.adminUser?.email || 'admin',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    await chatRef.set({
      lastMessage: '[image]',
      lastSenderType: 'admin',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: 'active'
    }, { merge: true });
    toast('Image sent.', 'success');
  } catch (err) {
    console.error('img upload', err);
    toast('Image upload failed: ' + (err.message || ''), 'error');
  } finally {
    document.querySelectorAll('.toast').forEach(t => { if (t.textContent.includes('Uploading image')) t.remove(); });
  }
}
window.handleConvImage = handleConvImage;

async function compressImage(file, maxDim) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('compress failed')), 'image/jpeg', 0.85);
    };
    img.onerror = () => reject(new Error('img load failed'));
    img.src = URL.createObjectURL(file);
  });
}

function exportLeads() {
  if (State.leads.length === 0) { toast('No leads to export.', 'warning'); return; }
  const rows = [['Name', 'Email', 'Phone', 'Source', 'Message', 'Created', 'Resolved']];
  State.leads.forEach(l => {
    const d = l.createdAt ? (l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt)) : new Date();
    rows.push([l.name||'', l.email||'', l.phone||'', l.source||'', l.message||'', d.toISOString(), l.resolved ? 'Yes' : 'No']);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rhc-leads-${new Date().toISOString().slice(0,10)}.csv`;

async function uploadSingleImage(slot) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    toast('Uploading image…', 'info', { duration: 0, id: 'imgup' });
    try {
      const comp = await compressImage(file, 1280);
      const url = await uploadToCloudinary(comp, file.name || `property-${Date.now()}.jpg`);
      document.getElementById('f-img' + slot).value = url;
      toast('Image uploaded.', 'success');
    } catch (e) {
      toast('Upload failed: ' + (e.message || ''), 'error');
    } finally {
      document.querySelectorAll('.toast').forEach(t => { if (t.textContent.includes('Uploading')) t.remove(); });
    }
  };
  input.click();
}
window.uploadSingleImage = uploadSingleImage;

async function saveListing(id) {
  // P2.4: Validation
  const addr = document.getElementById('f-address').value.trim();
  const city = document.getElementById('f-city').value.trim();
  const state = document.getElementById('f-state').value.trim();
  const price = parseInt(document.getElementById('f-price').value) || 0;
  if (!addr) { toast('Address is required.', 'error'); return; }
  if (!city) { toast('City is required.', 'error'); return; }
  if (!state) { toast('State is required.', 'error'); return; }
  if (price < 500 || price > 3500) { toast('Price must be between $500 and $3,500.', 'error'); return; }
  const data = {
    address: addr,
    city: city,
    state: state,
    zip: document.getElementById('f-zip').value.trim(),
    price: price,
    beds: parseInt(document.getElementById('f-beds').value) || 0,
    baths: parseFloat(document.getElementById('f-baths').value) || 0,
    sqft: parseInt(document.getElementById('f-sqft').value) || 0,
    type: document.getElementById('f-type').value,
    yearBuilt: parseInt(document.getElementById('f-year').value) || null,
    pets: document.getElementById('f-pets').value,
    parking: document.getElementById('f-parking').value.trim(),
    amenities: document.getElementById('f-amenities').value.split(',').map(s => s.trim()).filter(Boolean),
    description: document.getElementById('f-desc').value.trim(),
    placement: document.getElementById('f-placement').value,
    showOnMap: document.getElementById('f-showonmap').checked,
    images: [1,2,3,4].map(function(n) { return document.getElementById('f-img'+n).value.trim(); }).filter(Boolean),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    if (id) {
      await db.collection('listings').doc(id).set(data, { merge: true });
      toast('Property updated.', 'success');
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('listings').add(data);
      toast('Property added.', 'success');
    }
    closeModal();
  } catch (err) {
    console.error('saveListing', err);
    toast('Could not save property: ' + (err.code || err.message), 'error');
  }
}
window.saveListing = saveListing;

async function handleImageUpload(files) {
  const arr = Array.from(files || []);
  if (arr.length === 0) return;
  if (arr.length > 10) { toast('Max 10 images at a time.', 'warning'); return; }
  toast(`Uploading ${arr.length} image(s)…`, 'info', { duration: 0, id: 'batchup' });
  let ok = 0, fail = 0;
  for (const f of arr) {
    try {
      const comp = await compressImage(f, 1280);
      const url = await uploadToCloudinary(comp, f.name || `rhc-${Date.now()}.jpg`);
      await db.collection('images').add({
        url, name: f.name || '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      ok++;
    } catch (e) {
      console.warn('img upload fail', e);
      fail++;
    }
  }
  document.querySelectorAll('.toast').forEach(t => { if (t.textContent.includes('Uploading')) t.remove(); });
  toast(`Uploaded ${ok}/${arr.length}${fail ? `, ${fail} failed` : ''}.`, fail ? 'warning' : 'success');
  // Reset input so the same file can be re-uploaded
  const inp = document.getElementById('img-input');
  if (inp) inp.value = '';
}
window.handleImageUpload = handleImageUpload;

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    toast('URL copied to clipboard.', 'success');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('URL copied.', 'success');
  });
}
window.copyToClipboard = copyToClipboard;

                <td><strong>${escapeHtml(a.name || '-')}</strong></td>
                <td>${escapeHtml(a.email || '-')}</td>
                <td>${escapeHtml(a.phone || '-')}</td>
                <td>${escapeHtml(a.moveIn || '-')}</td>
                <td>${escapeHtml(String(a.occupants || '-'))}</td>
                <td>${escapeHtml(a.pets || '-')}</td>
                <td><span style="font-size:11px;padding:2px 8px;border-radius:8px;background:${a.status==='new'?'rgba(10,102,255,.1)':a.status==='in_review'?'rgba(245,158,11,.1)':a.status==='approved'?'rgba(16,185,129,.1)':'rgba(239,68,68,.1)'};color:${a.status==='new'?'#0A66FF':a.status==='in_review'?'#F59E0B':a.status==='approved'?'#10B981':'#EF4444'};font-weight:600">${escapeHtml(a.status || 'new')}</span></td>
                <td>${a.createdAt ? new Date(a.createdAt.toMillis ? a.createdAt.toMillis() : a.createdAt).toLocaleDateString() : '-'}</td>
                <td>
                  <button class="btn ${a.status==='new'?'btn-primary':'btn-ghost'}" style="padding:6px 10px;font-size:12px" onclick="updateApplicationStatus('${a.id}', '${a.status==='new'?'reviewed':'new'}')">${a.status==='new'?'Mark reviewed':'Mark new'}</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : `
        <div class="empty-state" style="padding:40px">
          <i class="fa-regular fa-file"></i>
          <h3>No applications yet</h3>
          <p>When visitors submit the "Start Application" form on the public site, their applications will appear here.</p>
        </div>
      `}
    </div>
  `;
}
window.renderApplications = renderApplications;

async function updateApplicationStatus(id, status) {
  try {
    await db.collection('applications').doc(id).set({ status: status }, { merge: true });
    toast('Application marked as ' + status + '.', 'success');
  } catch (e) {
    toast('Could not update: ' + (e.code || ''), 'error');
  }
}
window.updateApplicationStatus = updateApplicationStatus;

async function saveBranding() {
  const data = {
    brandText: document.getElementById('s-brandText').value.trim(),
    logoUrl: document.getElementById('s-logoUrl').value.trim(),
    email: document.getElementById('s-email').value.trim(),
    phone: document.getElementById('s-phone').value.trim()
  };
  try {
    await db.collection('settings').doc('branding').set(data, { merge: true });
    State.branding = { ...State.branding, ...data };
    applyBrandingToDocument();
    toast('Branding saved.', 'success');
  } catch (e) {
    toast('Could not save: ' + (e.code || ''), 'error');
  }
}
window.saveBranding = saveBranding;

async function saveSocial() {
  const data = {
    tiktok: document.getElementById('s-tiktok').value.trim(),
    tiktokAgents: document.getElementById('s-tiktokAgents').value.trim(),
    instagram: document.getElementById('s-instagram').value.trim(),
    facebook: document.getElementById('s-facebook').value.trim()
  };
  try {
    await db.collection('settings').doc('social').set(data, { merge: true });
    State.branding = { ...State.branding, ...data };

  } catch (e) {
    toast('Could not save: ' + (e.code || ''), 'error');
  }
}
window.saveSocial = saveSocial;

async function uploadBrandingLogo() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async () => {
    const f = input.files && input.files[0];
    if (!f) return;
    toast('Uploading logo…', 'info', { duration: 0, id: 'logoup' });
    try {
      const comp = await compressImage(f, 512);
      const url = await uploadToCloudinary(comp, 'rhc-logo-' + Date.now() + '.png');
      document.getElementById('s-logoUrl').value = url;
      toast('Logo uploaded. Click "Save branding" to apply.', 'success');
    } catch (e) {
      toast('Upload failed: ' + (e.message || ''), 'error');
    } finally {
      document.querySelectorAll('.toast').forEach(t => { if (t.textContent.includes('Uploading logo')) t.remove(); });
    }
  };
  input.click();
}
window.uploadBrandingLogo = uploadBrandingLogo;

function applyBrandingToDocument() {
  const b = State.branding || {};
  if (b.brandText) {
    document.title = `${b.brandText} — Staff Portal`;
    const brandNameEl = document.querySelector('.brand-name');
    if (brandNameEl) brandNameEl.textContent = b.brandText;
  }
  if (b.logoUrl) {
    const shield = document.getElementById('brand-shield');
    if (shield) shield.innerHTML = `<img src="${escapeHtml(b.logoUrl)}" alt="logo" style="width:100%;height:100%;object-fit:contain">`;
    const loginLogo = document.getElementById('login-logo');
    if (loginLogo) {
      loginLogo.classList.add('has-img');
      loginLogo.innerHTML = `<img src="${escapeHtml(b.logoUrl)}" alt="logo">`;
    }
  }
}

/* ----------------------------- Admin Watchers ----------------------------- */
function startAdminWatchers() {
  // Chats list
  if (State.unsubChatsList) { try { State.unsubChatsList(); } catch(e){} }
  State.unsubChatsList = db.collection('chats')
    .orderBy('updatedAt', 'desc')
    .onSnapshot(snap => {
      State.chats = [];
      snap.forEach(d => State.chats.push({ id: d.id, ...d.data() }));
      // Update nav badge
      const waitingCount = State.chats.filter(c => (c.status || 'waiting') === 'waiting').length;
      const badge = document.getElementById('nav-chats-badge');
      if (badge) {
        badge.textContent = waitingCount;
        badge.classList.toggle('hidden', waitingCount === 0);
      }
      // Re-render list if visible
      if (State.view === 'chats') renderChatList();
      // Re-render dashboard if visible
      if (State.view === 'dashboard') renderView();
    }, err => console.warn('chats list err', err));

  // Listings
  if (State.unsubListings) { try { State.unsubListings(); } catch(e){} }
  State.unsubListings = db.collection('listings')
    .onSnapshot(snap => {
      State.listings = [];
      snap.forEach(d => State.listings.push({ id: d.id, ...d.data() }));
      if (State.view === 'listings' || State.view === 'dashboard') renderView();
    }, err => console.warn('listings err', err));

  // Cities
  if (State.unsubCities) { try { State.unsubCities(); } catch(e){} }
  State.unsubCities = db.collection('cities')
    .onSnapshot(snap => {
      State.cities = [];
      snap.forEach(d => State.cities.push({ id: d.id, ...d.data() }));
      if (State.view === 'cities' || State.view === 'dashboard' || State.view === 'listings') renderView();
    }, err => console.warn('cities err', err));

  // Images
  if (State.unsubImages) { try { State.unsubImages(); } catch(e){} }
  State.unsubImages = db.collection('images')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      State.images = [];
      snap.forEach(d => State.images.push({ id: d.id, ...d.data() }));
      if (State.view === 'images' || State.view === 'dashboard') renderView();
    }, err => console.warn('images err', err));

  // Applications
  if (State.unsubApplications) { try { State.unsubApplications(); } catch(e){} }
  State.unsubApplications = db.collection('applications')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      State.applications = [];
      snap.forEach(d => State.applications.push({ id: d.id, ...d.data() }));
      if (State.view === 'applications') renderView();
    }, err => console.warn('applications err', err));

  // Applications
  if (State.unsubApplications) { try { State.unsubApplications(); } catch(e){} }
  State.unsubApplications = db.collection('applications')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      State.applications = [];
      snap.forEach(d => State.applications.push({ id: d.id, ...d.data() }));
      if (State.view === 'applications') renderView();
    }, err => console.warn('applications err', err));

  // Leads
  if (State.unsubLeads) { try { State.unsubLeads(); } catch(e){} }
  State.unsubLeads = db.collection('leads')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      State.leads = [];
      snap.forEach(d => State.leads.push({ id: d.id, ...d.data() }));
      const unresolved = State.leads.filter(l => !l.resolved).length;
      const badge = document.getElementById('nav-leads-badge');
      if (badge) {
        badge.textContent = unresolved;
        badge.classList.toggle('hidden', unresolved === 0);
      }
      if (State.view === 'leads' || State.view === 'dashboard') renderView();
    }, err => console.warn('leads err', err));

  // Branding
  if (State.unsubBranding) { try { State.unsubBranding(); } catch(e){} }
  State.unsubBranding = db.collection('settings').doc('branding').onSnapshot(d => {
    if (d.exists) {
      State.branding = { ...State.branding, ...d.data() };
      applyBrandingToDocument();
    }
  });
  // Social
  if (State.unsubSocial) { try { State.unsubSocial(); } catch(e){} }
  State.unsubSocial = db.collection('settings').doc('social').onSnapshot(d => {
    if (d.exists) {
      State.branding = { ...State.branding, ...d.data() };
      if (State.view === 'settings') renderView();
    }
  });
}

/* ----------------------------- Init ----------------------------- */
let authInitDone = false;
async function init() {
  // Load branding first so login screen has logo
  try {
    const doc = await db.collection('settings').doc('branding').get();
    if (doc.exists) State.branding = { ...State.branding, ...doc.data() };
  } catch (e) { console.warn('branding load', e); }
  try {
    const doc = await db.collection('settings').doc('social').get();
    if (doc.exists) State.branding = { ...State.branding, ...doc.data() };
  } catch (e) { console.warn('social load', e); }

  // Show login immediately (don't wait for auth check)
  renderLogin();

  // Listen for auth state changes (e.g. when user returns to the page already signed in).
  // Skip the very first fire if handleLogin() is mid-flight to avoid race condition.
  auth.onAuthStateChanged(async user => {
    if (authInitDone === false) {
      // First fire — just check for existing session, don't fight with handleLogin
      authInitDone = true;
      if (user && !State.isAdmin) {
        // Existing session — verify admin status
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists && userDoc.data().isAdmin === true) {
            State.isAdmin = true;
            State.adminUser = { uid: user.uid, email: user.email, lastLogin: new Date() };
            localStorage.setItem('rhc_admin', JSON.stringify(State.adminUser));
            renderAdmin();
            startAdminWatchers();
          } else if (userDoc.exists && userDoc.data().isAdmin !== true) {
            // Not an admin — sign out
            await auth.signOut();
          }
        } catch (e) { console.warn('existing session check', e); }
      }
    }
    // Subsequent fires (sign-in, sign-out) are handled by handleLogin() / signOutAdmin()
  });
}

init();
window.closeModal = closeModal;
